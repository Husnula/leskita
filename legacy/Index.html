<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
  :root{--bg:#f7f9fb;--surface:#fff;--surface2:#f2f4f6;--surface3:#e6e8ea;--text:#191c1e;--muted:#5f636f;--line:#dfe2ea;--primary:#073bbb;--primary2:#3156d3;--primary-soft:#e1e7ff;--sidebar:#20242b;--success:#087f5b;--success-bg:#e4f7f0;--warning:#925500;--warning-bg:#fff1d6;--danger:#ba1a1a;--danger-bg:#ffdad6;--shadow:0 8px 26px rgba(24,32,51,.08);--r:16px}
  html.dark{--bg:#121416;--surface:#1d2024;--surface2:#25292e;--surface3:#30343a;--text:#f5f6f8;--muted:#b3b8c2;--line:#383d45;--primary:#9db2ff;--primary2:#3156d3;--primary-soft:#28365f;--sidebar:#0e1012;--success:#6bd9b5;--success-bg:#163a31;--warning:#ffc56b;--warning-bg:#493315;--danger:#ffb4ab;--danger-bg:#4d2523;--shadow:0 12px 34px rgba(0,0,0,.28)}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-width:320px}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.mi{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:21px;line-height:1;vertical-align:middle}
  .shell{display:grid;grid-template-columns:256px minmax(0,1fr);height:100vh;overflow:hidden}.sidebar{background:var(--sidebar);color:#eef1f8;padding:20px 14px;display:flex;flex-direction:column;overflow:auto}.logo{display:flex;gap:12px;align-items:center;padding:0 9px;margin-bottom:24px}.logo-mark{width:42px;height:42px;border-radius:12px;background:var(--primary2);display:grid;place-items:center;color:#fff}.logo h1{font-size:22px;margin:0}.logo small{color:#aab1bd}.quick{width:100%;margin-bottom:18px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#aeb5c2;padding:11px 12px;border-radius:11px;text-align:left;display:flex;gap:11px;align-items:center}.nav button:hover{background:rgba(255,255,255,.07);color:#fff}.nav button.active{background:var(--primary2);color:#fff;font-weight:700}.sidebar-user{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:16px 8px 0;display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary2);color:#fff;display:grid;place-items:center;font-weight:800}.user-copy{min-width:0;flex:1}.user-copy b,.user-copy small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-copy small{color:#aeb5c2}.main{min-width:0;display:flex;flex-direction:column;overflow:hidden}.topbar{height:66px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex:0 0 auto}.search{display:flex;align-items:center;gap:8px;background:var(--surface2);padding:9px 14px;border-radius:999px;width:min(360px,42vw)}.search input{border:0;outline:0;background:transparent;color:var(--text);width:100%}.top-actions{display:flex;align-items:center;gap:8px}.icon-btn{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}.icon-btn:hover{background:var(--surface2);color:var(--primary)}.content{padding:28px;overflow:auto;flex:1}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}.page-head h2{font-size:30px;letter-spacing:-.025em;margin:0 0 5px}.page-head p{color:var(--muted);margin:0;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:var(--surface2)}.btn-primary{background:var(--primary2);border-color:var(--primary2);color:#fff}.btn-primary:hover{background:#2444b0}.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}.btn-sm{font-size:12px;padding:6px 9px}.btn-block{width:100%}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 2px 8px rgba(25,28,30,.03)}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:38px;height:38px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}.stat-value{font-size:30px;font-weight:800;margin-top:12px;letter-spacing:-.04em}.stat-note{font-size:11px;color:var(--muted);margin-top:4px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 3px 12px rgba(25,28,30,.035);overflow:hidden}.card-pad{padding:18px}.card-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.card-title{font-weight:800}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:13px;padding:11px;display:flex;align-items:center;gap:11px;background:var(--surface)}.item-main{min-width:0;flex:1}.item-title{font-weight:750;font-size:14px}.item-sub{font-size:12px;color:var(--muted);margin-top:3px}.datebox{width:46px;height:46px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;text-align:center;font-weight:800;font-size:11px;flex:0 0 auto}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.success{background:var(--success-bg);color:var(--success)}.warning{background:var(--warning-bg);color:var(--warning)}.danger{background:var(--danger-bg);color:var(--danger)}.info{background:var(--primary-soft);color:var(--primary)}.money{font-weight:800;font-variant-numeric:tabular-nums}.empty{padding:34px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.notice{padding:12px 14px;border-radius:12px;background:var(--warning-bg);color:var(--warning);font-size:12px;margin-bottom:16px}.credential{background:var(--success-bg);color:var(--success);padding:14px;border-radius:14px;margin-bottom:16px}.credential code{display:block;font-size:19px;font-weight:800;margin:5px 0;user-select:all}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase}.table td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle}.table tr:last-child td{border-bottom:0}.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .calendar-toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line)}.calendar-scroll{overflow:auto}.week-calendar{display:grid;grid-template-columns:58px repeat(7,minmax(120px,1fr));min-width:920px}.cal-head{height:54px;padding:8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;font-size:12px}.cal-head.today{background:var(--primary-soft);color:var(--primary);font-weight:800}.time-col{position:relative;height:784px;border-right:1px solid var(--line)}.time-label{height:56px;text-align:right;padding:0 8px;color:var(--muted);font-size:10px;transform:translateY(-6px)}.day-col{position:relative;height:784px;border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line) 56px)}.event{position:absolute;left:4px;right:4px;border-radius:9px;background:var(--primary2);color:#fff;padding:6px 7px;font-size:10px;overflow:hidden;box-shadow:0 3px 10px rgba(49,86,211,.22);border-left:4px solid rgba(255,255,255,.55)}.event.group{background:#7047b8}.event.done{background:var(--success)}.event b{display:block;font-size:11px}.cal-agenda{display:none}
  .profile-hero{background:linear-gradient(135deg,var(--primary2),#7047b8);color:#fff;padding:22px;border-radius:20px;margin-bottom:17px}.profile-hero h3{margin:0;font-size:24px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow:auto}.tabs button{border:0;background:transparent;color:var(--muted);padding:11px 13px;white-space:nowrap}.tabs button.active{color:var(--primary);border-bottom:2px solid var(--primary);font-weight:800}.report{padding:15px;border-left:4px solid var(--primary2);background:var(--surface);border-radius:0 13px 13px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.report h3{margin:0;font-size:15px}.report-meta{font-size:11px;color:var(--muted);margin:4px 0 10px}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.report-field{background:var(--surface2);padding:10px;border-radius:9px;font-size:12px}.report-field b{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}
  dialog{border:0;border-radius:20px;padding:0;max-width:720px;width:calc(100% - 28px);background:var(--surface);color:var(--text);box-shadow:0 28px 90px rgba(15,23,42,.3)}dialog::backdrop{background:rgba(15,23,42,.58);backdrop-filter:blur(3px)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.modal-body{padding:20px;max-height:68vh;overflow:auto}.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--surface2)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--surface);color:var(--text);outline:0}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary2);box-shadow:0 0 0 3px var(--primary-soft)}.hint{font-size:11px;color:var(--muted)}.tier-row{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:7px;align-items:end;margin-bottom:8px}
  .loading{position:fixed;inset:0;z-index:100;background:rgba(247,249,251,.8);backdrop-filter:blur(5px);display:grid;place-items:center}.loader{background:var(--surface);padding:20px;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}.spinner{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--primary2);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;right:18px;bottom:18px;z-index:120;background:var(--text);color:var(--surface);padding:12px 15px;border-radius:11px;box-shadow:var(--shadow);max-width:360px;font-size:13px}.toast.err{background:var(--danger);color:#fff}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,var(--primary-soft),transparent 36%),var(--bg)}.login-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.login-card h1{text-align:center;margin:12px 0 5px}.login-card>p{text-align:center;color:var(--muted);margin:0}.login-logo{margin:auto}.bottom-nav{display:none}
  @media(max-width:980px){.shell{grid-template-columns:1fr}.sidebar{display:none}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.content{padding:20px 16px 88px}.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:70px;background:var(--surface);border-top:1px solid var(--line);z-index:50;overflow-x:auto}.bottom-nav button{min-width:72px;flex:1;border:0;background:transparent;color:var(--muted);font-size:10px;display:grid;place-items:center;padding:7px 3px}.bottom-nav button.active{color:var(--primary);font-weight:800}.bottom-nav .mi{display:block;margin-bottom:3px}.topbar{padding:0 14px}.search{width:auto;flex:1}.grid3{grid-template-columns:1fr 1fr}}
  @media(max-width:700px){.page-head{display:block}.page-head h2{font-size:24px}.page-head .actions{margin-top:13px}.stats{gap:8px}.stat{padding:13px}.stat-value{font-size:23px}.grid3{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.report-grid{grid-template-columns:1fr}.item{flex-wrap:wrap}.week-calendar{display:none}.cal-agenda{display:block;padding:12px}.tier-row{grid-template-columns:1fr 1fr}.tier-row .tier-price{grid-column:1/-1}.content{padding:16px 12px 86px}.table th:nth-child(n+4),.table td:nth-child(n+4){display:none}}
</style>

<body>
  <div id="loading" class="loading"><div class="loader"><div class="spinner"></div><span>Memuat LesKita…</span></div></div>
  <div id="root"></div>
  <dialog id="modal"><form id="modalForm"><div class="modal-head"><h3 id="modalTitle">Form</h3><button type="button" class="icon-btn" data-close><span class="mi">close</span></button></div><div id="modalBody" class="modal-body"></div><div id="modalError" class="notice hidden" style="margin:0 20px 10px"></div><div class="modal-foot"><button type="button" class="btn" data-close>Batal</button><button id="modalSubmit" type="submit" class="btn btn-primary">Simpan</button></div></form></dialog>
  <div id="toast" class="toast hidden"></div>
  <script>
  const TOKEN='leskita_auth_token';
  const root=document.getElementById('root');
  const state={boot:null,d:null,page:'dashboard',weekOffset:0,modalType:null,credential:null,selectedStudent:null};
  const roleMenus={
    ADMIN:[['dashboard','dashboard','Dashboard'],['teachers','school','Guru SaaS'],['plans','sell','Paket']],
    TEACHER:[['dashboard','dashboard','Beranda'],['calendar','calendar_month','Kalender'],['classes','groups','Kelas'],['students','person','Siswa'],['applications','how_to_reg','Pendaftaran'],['reports','assignment','Laporan'],['fees','payments','Tagihan'],['pricing','price_change','Tarif'],['settings','settings','Pengaturan']],
    PARENT:[['dashboard','home','Beranda'],['calendar','event','Jadwal'],['reports','monitoring','Progres'],['fees','receipt_long','Biaya & Dokumen'],['account','manage_accounts','Akun']]
  };
  const $=s=>document.querySelector(s);const h=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const rp=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v||0));
  const dt=(v,opt={day:'numeric',month:'short',year:'numeric'})=>v?new Intl.DateTimeFormat('id-ID',opt).format(new Date(v)):'-';
  const dtime=v=>dt(v,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});const role=()=>state.boot?.user?.role;
  const initials=n=>String(n||'U').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
  function api(action,data={},tenantId){return new Promise((res,rej)=>{if(!(window.google&&google.script&&google.script.run))return rej(new Error('Buka aplikasi melalui deployment Google Apps Script.'));google.script.run.withSuccessHandler(r=>r?.ok?res(r.data):rej(new Error(r?.error||'Terjadi kesalahan.'))).withFailureHandler(e=>rej(new Error(e.message||String(e)))).api(action,{data,tenantId:tenantId||state.boot?.user?.tenant_id,authToken:localStorage.getItem(TOKEN)||''})})}
  function busy(on){$('#loading')?.classList.toggle('hidden',!on)}function toast(msg,err=false){const el=$('#toast');el.textContent=msg;el.className='toast'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3800)}
  function badge(s){const m={ACTIVE:'success',PAID:'success',APPROVED:'success',DONE:'success',TRIAL:'info',NEW:'info',SCHEDULED:'info',UNPAID:'warning',PARTIAL:'warning',SUSPENDED:'danger',CANCELLED:'danger',REJECTED:'danger',ARCHIVED:'danger'};return `<span class="badge ${m[s]||'info'}">${h(s)}</span>`}
  function student(id){return state.d?.students?.find(x=>x.student_id===id)||{name:'Siswa'}}function klass(id){return state.d?.classes?.find(x=>x.class_id===id)||{name:'Kelas'}}
  async function start(){const publicToken=new URLSearchParams(location.search).get('daftar');if(publicToken){busy(true);try{const form=await api('getPublicEnrollmentForm',{token:publicToken});renderPublicForm(form)}catch(e){renderLogin(e.message)}finally{busy(false)}return}if(!localStorage.getItem(TOKEN)){busy(false);renderLogin();return}busy(true);try{state.boot=await api('bootstrap',{},'');state.d=state.boot.dashboard;render()}catch(e){localStorage.removeItem(TOKEN);renderLogin(e.message)}finally{busy(false)}}
  function renderLogin(message=''){root.innerHTML=`<main class="login"><section class="login-card"><div class="logo-mark login-logo"><span class="mi">school</span></div><h1>Masuk ke LesKita</h1><p>Gunakan email terdaftar dan password Anda.</p>${message?`<div class="notice" style="margin-top:16px">${h(message)}</div>`:''}<form id="loginForm" class="form-grid" style="margin-top:22px"><div class="field full"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field full"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><div class="field full"><button class="btn btn-primary btn-block">Masuk</button></div></form></section></main>`;$('#loginForm').onsubmit=login}
  async function login(e){e.preventDefault();busy(true);try{const r=await api('login',Object.fromEntries(new FormData(e.currentTarget)));localStorage.setItem(TOKEN,r.token);state.boot=r.bootstrap;state.d=state.boot.dashboard;render();if(state.boot.user.must_change_password)toast('Silakan ganti password sementara.')}catch(x){renderLogin(x.message)}finally{busy(false)}}
  async function logout(){try{await api('logout')}catch(e){}localStorage.removeItem(TOKEN);state.boot=null;state.d=null;renderLogin()}
  function renderPublicForm(form){root.innerHTML=`<main class="login"><section class="login-card" style="max-width:680px"><div class="logo-mark login-logo"><span class="mi">school</span></div><h1>${h(form.workspaceName)}</h1><p>Formulir pendaftaran calon siswa · ${h(form.teacherName)}</p><form id="publicForm" class="form-grid" style="margin-top:22px"><input type="hidden" name="token" value="${h(form.token)}">${field('student_name','Nama lengkap siswa','text',true)}${field('nickname','Nama panggilan')}${field('birth_date','Tanggal lahir','date')}${field('student_phone','No. WhatsApp siswa')}${field('school','Sekolah')}${field('grade','Kelas/tingkat','text',true)}${field('subject','Mata pelajaran','text',true)}${field('parent_name','Nama orang tua/wali','text',true)}${field('parent_relation','Hubungan dengan siswa')}${field('parent_phone','No. WhatsApp orang tua','tel',true)}${field('parent_email','Email orang tua','email',true)}${area('address','Alamat')}${area('learning_goal','Tujuan belajar')}${area('preferred_schedule','Pilihan hari dan jam')}${area('notes','Catatan tambahan')}<div class="field full"><label><input type="checkbox" required> Saya menyetujui data ini digunakan untuk administrasi les.</label></div><div class="field full"><button class="btn btn-primary btn-block">Kirim pendaftaran</button></div></form></section></main>`;$('#publicForm').onsubmit=submitPublicForm}
  async function submitPublicForm(e){e.preventDefault();busy(true);try{await api('submitStudentApplication',Object.fromEntries(new FormData(e.currentTarget)));e.currentTarget.innerHTML='<div class="credential"><b>Pendaftaran berhasil dikirim.</b><p>Guru akan menghubungi Anda melalui WhatsApp atau email.</p></div>'}catch(x){toast(x.message,true)}finally{busy(false)}}
  function field(name,label,type='text',required=false,value=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${h(value)}" ${required?'required':''}></div>`}function area(name,label,value=''){return `<div class="field full"><label>${label}</label><textarea name="${name}">${h(value)}</textarea></div>`}
  function render(){const menus=roleMenus[role()]||[];if(!menus.some(x=>x[0]===state.page)&&state.page!=='more')state.page='dashboard';root.innerHTML=`<div class="shell"><aside class="sidebar"><div class="logo"><div class="logo-mark"><span class="mi">school</span></div><div><h1>LesKita</h1><small>Tutoring Management</small></div></div>${role()==='TEACHER'?`<button class="btn btn-primary quick" data-open="session"><span class="mi">add</span>Sesi tambahan</button>`:''}<nav class="nav">${nav(menus)}</nav><div class="sidebar-user"><div class="avatar">${h(initials(state.boot.user.name))}</div><div class="user-copy"><b>${h(state.boot.user.name)}</b><small>${h(role())}</small></div><button class="icon-btn" data-logout style="color:#fff"><span class="mi">logout</span></button></div></aside><section class="main"><header class="topbar"><div class="search"><span class="mi">search</span><input placeholder="Cari siswa, kelas, atau tagihan…"></div><div class="top-actions"><button class="icon-btn" data-theme><span class="mi">dark_mode</span></button><button class="icon-btn"><span class="mi">notifications</span></button><div class="avatar">${h(initials(state.boot.user.name))}</div></div></header><main class="content">${state.boot.user.must_change_password?`<div class="notice">Anda masih menggunakan password sementara. <button class="btn btn-sm" data-open="password">Ganti sekarang</button></div>`:''}${page()}</main></section><nav class="bottom-nav">${mobileNav(menus)}</nav></div>`;bind()}
  function nav(menus){return menus.map(([id,icon,label])=>`<button class="${state.page===id?'active':''}" data-page="${id}"><span class="mi">${icon}</span><span>${label}</span></button>`).join('')}
  function mobileNav(menus){if(menus.length<=5)return nav(menus);return nav(menus.slice(0,4))+`<button class="${state.page==='more'?'active':''}" data-page="more"><span class="mi">more_horiz</span><span>Lainnya</span></button>`}
  function header(title,sub,actions=''){return `<div class="page-head"><div><h2>${h(title)}</h2><p>${h(sub)}</p></div><div class="actions">${actions}</div></div>`}function stat(label,val,icon,note=''){return `<div class="stat"><div class="stat-top"><span>${h(label)}</span><span class="stat-icon"><span class="mi">${icon}</span></span></div><div class="stat-value">${h(val)}</div>${note?`<div class="stat-note">${h(note)}</div>`:''}</div>`}
  function page(){if(role()==='ADMIN')return adminPage();if(role()==='TEACHER')return teacherPage();return parentPage()}
  function adminPage(){const d=state.d;if(state.page==='teachers')return `${header('Guru SaaS','Kelola pelanggan, trial, dan akses.',`<button class="btn btn-primary" data-open="teacher"><span class="mi">add</span>Tambah guru</button>`)}${state.credential?credential('Password sementara guru'):''}<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Guru</th><th>Workspace</th><th>Status</th><th>Murid</th><th>Aksi</th></tr></thead><tbody>${d.tenants.map(t=>`<tr><td><b>${h(t.teacher_name)}</b><br><small>${h(t.teacher_email)}</small></td><td>${h(t.workspace_name)}</td><td>${badge(t.status)}</td><td>${h(t.student_count)}</td><td><div class="row-actions"><button class="btn btn-sm" data-reset-teacher="${h(t.tenant_id)}">Reset password</button>${t.status!=='ACTIVE'?`<button class="btn btn-sm" data-tenant-status="ACTIVE" data-id="${h(t.tenant_id)}">Aktifkan</button>`:''}${t.status!=='SUSPENDED'?`<button class="btn btn-sm btn-danger" data-tenant-status="SUSPENDED" data-id="${h(t.tenant_id)}">Suspend</button>`:''}</div></td></tr>`).join('')}</tbody></table></div></div>`;if(state.page==='plans')return `${header('Paket SaaS','Kelola harga dan kuota paket.',`<button class="btn btn-primary" data-open="plan"><span class="mi">add</span>Tambah paket</button>`)}<div class="grid3">${d.plans.map(p=>`<div class="card card-pad"><div class="card-title">${h(p.name)} ${badge(p.status)}</div><div class="stat-value">${rp(p.monthly_price)}</div><p class="item-sub">Maksimal ${h(p.student_limit)} murid aktif.</p><div class="row-actions"><button class="btn btn-sm" data-edit-plan="${h(p.plan_id)}">Edit</button>${p.status!=='ARCHIVED'?`<button class="btn btn-sm btn-danger" data-archive-plan="${h(p.plan_id)}">Arsip</button>`:''}</div></div>`).join('')}</div>`;return `${header('Dashboard SaaS','Pantau kesehatan dan pertumbuhan platform.')}<div class="stats">${stat('Total guru',d.stats.totalTeachers,'school')}${stat('Aktif',d.stats.active,'verified')}${stat('Trial',d.stats.trial,'timer')}${stat('Suspended',d.stats.suspended,'block')}</div><div class="grid2"><div class="card"><div class="card-head"><span class="card-title">Guru terbaru</span><button class="btn btn-sm" data-page="teachers">Lihat semua</button></div><div class="card-pad list">${d.tenants.slice(-5).reverse().map(t=>`<div class="item"><div class="avatar">${h(initials(t.teacher_name))}</div><div class="item-main"><div class="item-title">${h(t.teacher_name)}</div><div class="item-sub">${h(t.workspace_name)} · ${h(t.student_count)} murid</div></div>${badge(t.status)}</div>`).join('')}</div></div><div class="card card-pad"><div class="card-title">Model bisnis</div><div class="notice" style="margin-top:12px">Platform memproses langganan guru. Pembayaran les tetap langsung antara orang tua dan guru.</div></div></div>`}
  function teacherPage(){if(state.page==='more')return `${header('Menu lainnya','Pilih modul yang ingin dibuka.')}<div class="grid3">${roleMenus.TEACHER.slice(4).map(([id,icon,label])=>`<button class="card card-pad" data-page="${id}" style="text-align:left;color:var(--text)"><span class="stat-icon"><span class="mi">${icon}</span></span><h3>${h(label)}</h3></button>`).join('')}</div>`;if(state.page==='calendar')return calendarPage(false);if(state.page==='classes')return classesPage();if(state.page==='students')return studentsPage();if(state.page==='applications')return applicationsPage();if(state.page==='reports')return reportsPage();if(state.page==='fees')return feesPage(true);if(state.page==='pricing')return pricingPage();if(state.page==='settings')return settingsPage();return teacherDashboard()}
  function teacherDashboard(){const d=state.d;const today=d.sessions.filter(s=>new Date(s.start_at).toDateString()===new Date().toDateString()&&s.status!=='CANCELLED');return `${header('Selamat datang, '+state.boot.user.name,'Kelola pekerjaan penting hari ini.')}<div class="stats">${stat('Siswa aktif',d.stats.activeStudents,'group')}${stat('Jadwal mendatang',d.stats.upcomingSessions,'event')}${stat('Laporan tertunda',d.stats.unpublishedReports,'assignment_late')}${stat('Belum lunas',rp(d.stats.unpaidTotal),'payments')}</div><div class="grid2"><div class="card"><div class="card-head"><span class="card-title">Sesi hari ini</span><button class="btn btn-sm" data-page="calendar">Buka kalender</button></div><div class="card-pad">${sessionList(today,true)}</div></div><div class="card"><div class="card-head"><span class="card-title">Perlu tindakan</span></div><div class="card-pad list"><div class="item"><span class="stat-icon"><span class="mi">how_to_reg</span></span><div class="item-main"><div class="item-title">${state.d.applications.filter(a=>a.status==='NEW').length} pendaftaran baru</div></div><button class="btn btn-sm" data-page="applications">Tinjau</button></div><div class="item"><span class="stat-icon"><span class="mi">assignment_late</span></span><div class="item-main"><div class="item-title">${d.stats.unpublishedReports} laporan tertunda</div></div><button class="btn btn-sm" data-page="reports">Buka</button></div></div></div></div>`}
  function classesPage(){const d=state.d,active=d.classes.filter(c=>c.status==='ACTIVE');return `${header('Kelas','Kelas individu atau kelompok dan jadwal rutinnya.',`<button class="btn btn-primary" data-open="class"><span class="mi">add</span>Buat kelas</button>`)}<div class="grid3">${active.length?active.map(c=>{const mem=d.classMembers.filter(m=>m.class_id===c.class_id&&m.status==='ACTIVE'),rules=d.scheduleRules.filter(r=>r.class_id===c.class_id&&r.status==='ACTIVE'),profile=d.pricingProfiles.find(p=>p.profile_id===c.pricing_profile_id);return `<div class="card card-pad"><div class="card-title">${h(c.name)} ${badge(c.class_type==='GROUP'?'GROUP':'INDIVIDUAL')}</div><p class="item-sub">${h(c.subject)} · ${h(c.duration_minutes)} menit · ${mem.length} peserta</p><p class="item-sub">${rules.map(r=>dayName(r.day_of_week)+' '+r.start_time).join(', ')}</p><p class="item-sub">Tarif: ${profile?h(profile.name):rp(c.default_fee_amount)}</p><div class="row-actions"><button class="btn btn-sm" data-edit-class="${h(c.class_id)}">Edit</button><button class="btn btn-sm btn-danger" data-archive-class="${h(c.class_id)}">Arsip</button></div></div>`}).join(''):`<div class="empty">Belum ada kelas.</div>`}</div>`}
  function studentsPage(){const d=state.d;return `${header('Database Siswa','Profil, orang tua, kebutuhan belajar, dan riwayat.',`<button class="btn btn-primary" data-open="student"><span class="mi">person_add</span>Tambah siswa</button>`)}${state.credential?.kind==='parent'?credential('Password sementara orang tua'):''}<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Siswa</th><th>Sekolah</th><th>Orang tua</th><th>WhatsApp</th><th>Aksi</th></tr></thead><tbody>${d.students.map(s=>`<tr><td><b>${h(s.name)}</b><br><small>${h(s.grade)} · ${h(s.subject)}</small></td><td>${h(s.school||'-')}</td><td>${h(s.parent_name)}<br><small>${h(s.parent_email)}</small></td><td>${h(s.parent_phone||s.phone||'-')}</td><td><div class="row-actions"><button class="btn btn-sm" data-view-student="${h(s.student_id)}">Profil</button><button class="btn btn-sm" data-edit-student="${h(s.student_id)}">Edit</button><button class="btn btn-sm" data-parent-access="${h(s.student_id)}">Akses orang tua</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
  function applicationsPage(){const apps=state.d.applications;return `${header('Pendaftaran Online','Terima calon siswa melalui formulir publik.',`<button class="btn btn-primary" data-form-link><span class="mi">link</span>Buat/salin tautan</button>`)}<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Calon siswa</th><th>Orang tua</th><th>Pelajaran</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${apps.length?apps.map(a=>`<tr><td><b>${h(a.student_name)}</b><br><small>${dt(a.submitted_at)}</small></td><td>${h(a.parent_name)}<br><small>${h(a.parent_phone)}</small></td><td>${h(a.subject)} · ${h(a.grade)}</td><td>${badge(a.status)}</td><td><div class="row-actions">${a.status==='NEW'?`<button class="btn btn-sm btn-primary" data-approve-app="${h(a.application_id)}">Setujui</button><button class="btn btn-sm btn-danger" data-reject-app="${h(a.application_id)}">Tolak</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">Belum ada pendaftaran.</div></td></tr>`}</tbody></table></div></div>`}
  function calendarPage(parent){const sessions=state.d.sessions.filter(s=>s.status!=='CANCELLED');return `${header(parent?'Jadwal belajar':'Kalender Mingguan',parent?'Jadwal yang dibuat oleh guru.':'Lihat waktu terisi dan slot yang masih kosong.',parent?'':`<button class="btn btn-primary" data-open="session"><span class="mi">add</span>Sesi tambahan</button>`)}${weekCalendar(sessions,parent)}`}
  function weekCalendar(sessions,parent){const start=weekStart(state.weekOffset),days=[0,1,2,3,4,5,6].map(i=>new Date(start.getTime()+i*86400000));const inWeek=sessions.filter(s=>{const d=new Date(s.start_at);return d>=days[0]&&d<new Date(days[6].getTime()+86400000)});return `<div class="card"><div class="calendar-toolbar"><div class="actions"><button class="btn btn-sm" data-week="-1"><span class="mi">chevron_left</span></button><button class="btn btn-sm" data-week="0">Hari ini</button><button class="btn btn-sm" data-week="1"><span class="mi">chevron_right</span></button></div><b>${dt(days[0])} – ${dt(days[6])}</b></div><div class="calendar-scroll"><div class="week-calendar"><div class="cal-head"></div>${days.map(d=>`<div class="cal-head ${d.toDateString()===new Date().toDateString()?'today':''}">${dayName(d.getDay())}<br><b>${d.getDate()}</b></div>`).join('')}<div class="time-col">${Array.from({length:14},(_,i)=>`<div class="time-label">${String(i+7).padStart(2,'0')}:00</div>`).join('')}</div>${days.map(day=>`<div class="day-col">${inWeek.filter(s=>new Date(s.start_at).toDateString()===day.toDateString()).map(s=>eventHtml(s,parent)).join('')}</div>`).join('')}</div><div class="cal-agenda">${sessionList(inWeek,parent)}</div></div></div>`}
  function eventHtml(s,parent){const d=new Date(s.start_at),top=((d.getHours()+d.getMinutes()/60)-7)*56,height=Math.max(30,Number(s.duration_minutes||60)/60*56),c=klass(s.class_id);return `<div class="event ${c.class_type==='GROUP'?'group':''} ${s.status==='DONE'?'done':''}" style="top:${top}px;height:${height}px" data-session="${h(s.session_id)}"><b>${h(c.name||student(s.student_id).name)}</b>${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} · ${h(s.subject)}</div>`}
  function reportsPage(){return `${header(role()==='PARENT'?'Progres Belajar':'Laporan Progres',role()==='PARENT'?'Laporan yang diterbitkan guru.':'Catatan individual untuk setiap siswa.')}<div class="list">${state.d.reports.length?state.d.reports.map(reportHtml).join(''):`<div class="empty">Belum ada laporan.</div>`}</div>`}function reportHtml(r){return `<article class="report"><h3>${h(student(r.student_id).name)} · ${h(r.material)}</h3><div class="report-meta">${dtime(r.published_at)}${r.score!==''?' · Nilai '+h(r.score):''}</div><div class="report-grid"><div class="report-field"><b>PROGRES</b>${h(r.progress)}</div><div class="report-field"><b>PR/LATIHAN</b>${h(r.homework||'Tidak ada')}</div>${r.teacher_note?`<div class="report-field" style="grid-column:1/-1"><b>CATATAN GURU</b>${h(r.teacher_note)}</div>`:''}</div></article>`}
  function pricingPage(){const p=state.d.pricingProfiles.filter(x=>x.status==='ACTIVE');return `${header('Aturan Tarif','Tarif kelompok ditentukan oleh jumlah peserta yang hadir.',`<button class="btn btn-primary" data-open="pricing"><span class="mi">add</span>Aturan tarif</button>`)}<div class="notice">Contoh: 1 peserta Rp70.000/orang, 2 peserta Rp50.000/orang. Tarif dipotret saat presensi disimpan.</div><div class="grid3">${p.length?p.map(x=>{const tiers=state.d.pricingTiers.filter(t=>t.profile_id===x.profile_id&&t.status==='ACTIVE');return `<div class="card card-pad"><div class="card-title">${h(x.name)}</div><p class="item-sub">${h(x.scope)}</p><div class="list">${tiers.map(t=>`<div class="item"><div class="item-main">${h(t.min_attendees)}–${h(t.max_attendees)} hadir</div><b>${rp(t.price_per_student)}/orang</b></div>`).join('')}</div><div class="row-actions"><button class="btn btn-sm" data-edit-pricing="${h(x.profile_id)}">Edit</button><button class="btn btn-sm btn-danger" data-archive-pricing="${h(x.profile_id)}">Arsip</button></div></div>`}).join(''):`<div class="empty">Belum ada aturan tarif.</div>`}</div>`}
  function feesPage(teacher){const fees=state.d.fees;return `${header(teacher?'Tagihan & Pencatatan':'Biaya & Dokumen',teacher?'Hitung otomatis dari presensi dan kirim pengingat.':'Pembayaran tetap dilakukan langsung kepada guru.',teacher?`<button class="btn" data-sync-fees><span class="mi">sync</span>Hitung ulang</button><button class="btn btn-primary" data-open="fee"><span class="mi">add</span>Catatan manual</button>`:'')}<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Siswa/periode</th><th>Rincian</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${fees.length?fees.map(f=>`<tr><td><b>${h(student(f.student_id).name)}</b><br><small>${h(f.period)}</small></td><td>${h(f.description)}<br><small>${f.source_type==='AUTOMATIC'?'Dihitung dari presensi':'Catatan manual'}</small></td><td class="money">${rp(f.amount)}</td><td>${badge(f.status)}</td><td><div class="row-actions">${teacher?`${f.status!=='PAID'?`<button class="btn btn-sm" data-paid="${h(f.fee_id)}">Tandai lunas</button>`:''}<button class="btn btn-sm" data-wa="${h(f.fee_id)}">WhatsApp</button><button class="btn btn-sm" data-doc="INVOICE" data-fee="${h(f.fee_id)}">Invoice</button>${f.status==='PAID'?`<button class="btn btn-sm" data-doc="RECEIPT" data-fee="${h(f.fee_id)}">Kuitansi</button>`:''}`:`${f.invoice_file_id?`<button class="btn btn-sm" data-download="INVOICE" data-fee="${h(f.fee_id)}">Invoice</button>`:''}${f.receipt_file_id?`<button class="btn btn-sm" data-download="RECEIPT" data-fee="${h(f.fee_id)}">Kuitansi</button>`:''}`}</div></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">Belum ada catatan biaya.</div></td></tr>`}</tbody></table></div></div>`}
  function settingsPage(){const s=state.d.settings||{};return `${header('Pengaturan Workspace','Profil guru, pembayaran, template pesan, dan keamanan.',`<button class="btn" data-open="password">Ganti password</button>`)}<div class="card card-pad"><form id="settingsForm" class="form-grid">${field('teacher_name','Nama guru','text',true,s.teacher_name)}${field('workspace_name','Nama workspace','text',true,s.workspace_name)}${field('phone','Nomor WhatsApp','tel',false,s.phone)}${field('default_due_day','Tanggal jatuh tempo','number',false,s.default_due_day||10)}${area('payment_instructions','Instruksi pembayaran',s.payment_instructions)}${area('whatsapp_template','Template WhatsApp',s.whatsapp_template||'Halo {{nama_orang_tua}}, tagihan les {{nama_siswa}} periode {{periode}} sebesar {{total}}. Jatuh tempo {{jatuh_tempo}}. {{instruksi_pembayaran}}')}<input type="hidden" name="default_fee_type" value="PER_SESSION"><input type="hidden" name="default_fee_amount" value="0"><div class="field full"><button class="btn btn-primary">Simpan pengaturan</button></div></form></div>`}
  function parentPage(){if(state.page==='calendar')return calendarPage(true);if(state.page==='reports')return reportsPage();if(state.page==='fees')return feesPage(false);if(state.page==='account')return `${header('Akun','Kelola keamanan akun.',`<button class="btn btn-primary" data-open="password">Ganti password</button>`)}<div class="card card-pad"><div class="item"><div class="avatar">${h(initials(state.boot.user.name))}</div><div class="item-main"><div class="item-title">${h(state.boot.user.name)}</div><div class="item-sub">${h(state.boot.user.email)}</div></div><button class="btn" data-logout>Keluar</button></div></div>`;const next=state.d.sessions.find(s=>new Date(s.start_at)>=new Date()&&s.status!=='CANCELLED');return `${header('Halo, '+state.boot.user.name,'Pantau jadwal, perkembangan, dan administrasi belajar.')} ${next?`<div class="profile-hero"><small>Jadwal berikutnya</small><h3>${h(klass(next.class_id).name||student(next.student_id).name)} · ${h(next.subject)}</h3><p>${dtime(next.start_at)} · ${h(next.location||'Lokasi menyusul')}</p></div>`:''}<div class="stats">${stat('Anak terhubung',state.d.students.length,'person')}${stat('Jadwal mendatang',state.d.stats.upcomingSessions,'event')}${stat('Laporan tersedia',state.d.stats.publishedReports,'assignment')}${stat('Belum lunas',rp(state.d.stats.unpaidTotal),'payments')}</div><div class="grid2"><div class="card"><div class="card-head"><span class="card-title">Progres terbaru</span></div><div class="card-pad">${state.d.reports[0]?reportHtml(state.d.reports[0]):`<div class="empty">Belum ada laporan.</div>`}</div></div><div class="card"><div class="card-head"><span class="card-title">Biaya terbaru</span></div><div class="card-pad">${state.d.fees[0]?`<div class="item"><div class="item-main"><div class="item-title">${h(state.d.fees[0].description)}</div><div class="item-sub">${h(state.d.fees[0].period)}</div></div><b>${rp(state.d.fees[0].amount)}</b></div>`:`<div class="empty">Belum ada biaya.</div>`}</div></div></div>`}
  function sessionList(items,parent){return items.length?`<div class="list">${items.map(s=>`<div class="item"><div class="datebox">${new Date(s.start_at).getDate()}<br>${dt(s.start_at,{month:'short'})}</div><div class="item-main"><div class="item-title">${h(s.class_id?klass(s.class_id).name:student(s.student_id).name)} · ${h(s.subject)}</div><div class="item-sub">${dtime(s.start_at)} · ${h(s.duration_minutes)} menit</div></div>${badge(s.status)}${!parent&&s.status!=='CANCELLED'?`<button class="btn btn-sm" data-attendance="${h(s.session_id)}">Presensi</button><button class="btn btn-sm" data-report="${h(s.session_id)}">Laporan</button>`:''}</div>`).join('')}</div>`:`<div class="empty">Tidak ada jadwal.</div>`}
  function credential(title){return `<div class="credential"><b>${h(title)}</b><div>${h(state.credential.email)}</div><code>${h(state.credential.password)}</code><small>Salin sekarang; password hanya ditampilkan pada sesi ini.</small></div>`}function dayName(d){return ['Min','Sen','Sel','Rab','Kam','Jum','Sab'][Number(d)]||'-'}function weekStart(offset=0){const n=new Date(),day=(n.getDay()+6)%7;n.setHours(0,0,0,0);n.setDate(n.getDate()-day+offset*7);return n}

  function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open));document.querySelectorAll('[data-logout]').forEach(b=>b.onclick=logout);document.querySelector('[data-theme]')?.addEventListener('click',()=>{document.documentElement.classList.toggle('dark');localStorage.setItem('leskita_theme',document.documentElement.classList.contains('dark')?'dark':'light')});document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{const v=Number(b.dataset.week);state.weekOffset=v===0?0:state.weekOffset+v;render()});bindActions();$('#settingsForm')?.addEventListener('submit',saveSettings)}
  function bindActions(){document.querySelectorAll('[data-edit-plan]').forEach(b=>b.onclick=()=>openModal('plan',state.d.plans.find(x=>x.plan_id===b.dataset.editPlan)));document.querySelectorAll('[data-archive-plan]').forEach(b=>b.onclick=()=>simpleAction('archivePlan',{plan_id:b.dataset.archivePlan},'Paket diarsipkan.'));document.querySelectorAll('[data-reset-teacher]').forEach(b=>b.onclick=()=>resetTeacher(b.dataset.resetTeacher));document.querySelectorAll('[data-tenant-status]').forEach(b=>b.onclick=()=>simpleAction('updateTenantStatus',{tenant_id:b.dataset.id,status:b.dataset.tenantStatus},'Status diperbarui.'));document.querySelectorAll('[data-edit-student]').forEach(b=>b.onclick=()=>openModal('student',state.d.students.find(x=>x.student_id===b.dataset.editStudent)));document.querySelectorAll('[data-view-student]').forEach(b=>b.onclick=()=>studentProfile(b.dataset.viewStudent));document.querySelectorAll('[data-parent-access]').forEach(b=>b.onclick=()=>parentAccess(b.dataset.parentAccess));document.querySelectorAll('[data-edit-class]').forEach(b=>b.onclick=()=>openModal('class',state.d.classes.find(x=>x.class_id===b.dataset.editClass)));document.querySelectorAll('[data-archive-class]').forEach(b=>b.onclick=()=>simpleAction('archiveClass',{class_id:b.dataset.archiveClass},'Kelas diarsipkan.'));document.querySelectorAll('[data-edit-pricing]').forEach(b=>b.onclick=()=>openModal('pricing',state.d.pricingProfiles.find(x=>x.profile_id===b.dataset.editPricing)));document.querySelectorAll('[data-archive-pricing]').forEach(b=>b.onclick=()=>simpleAction('archivePricingProfile',{profile_id:b.dataset.archivePricing},'Aturan tarif diarsipkan.'));document.querySelectorAll('[data-attendance]').forEach(b=>b.onclick=()=>openModal('attendance',{session_id:b.dataset.attendance}));document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>openModal('report',{session_id:b.dataset.report}));if(role()==='TEACHER')document.querySelectorAll('[data-session]').forEach(b=>b.onclic   function studentProfile(id){state.selectedStudent=id;const s=student(id),reports=state.d.reports.filter(r=>r.student_id===id),fees=state.d.fees.filter(f=>f.student_id===id);$('.content').innerHTML=`${header('Profil '+s.name,'Database lengkap siswa.',`<button class="btn" data-back-students>Kembali</button><button class="btn btn-primary" data-edit-student="${h(id)}">Edit profil</button>`)}<div class="profile-hero"><h3>${h(s.name)}</h3><p>${h(s.school||'-')} · ${h(s.grade||'-')} · ${h(s.subject||'-')}</p></div><div class="grid2"><div class="card card-pad"><div class="card-title">Identitas & Kontak</div><div class="list" style="margin-top:12px"><div class="item"><div class="item-main"><div class="item-sub">Alamat</div><b>${h(s.address||'-')}</b></div></div><div class="item"><div class="item-main"><div class="item-sub">Orang tua</div><b>${h(s.parent_name)} · ${h(s.parent_phone||'-')}</b></div></div><div class="item"><div class="item-main"><div class="item-sub">Tujuan belajar</div><b>${h(s.learning_goal||'-')}</b></div></div></div></div><div class="card card-pad"><div class="card-title">Ringkasan</div><div class="stats" style="grid-template-columns:1fr 1fr;margin-top:12px">${stat('Laporan',reports.length,'assignment')}${stat('Catatan biaya',fees.length,'payments')}</div></div></div>`;document.querySelector('[data-back-students]').onclick=()=>{state.page='students';render()};document.querySelector('[data-edit-student]').onclick=()=>openModal('student',s)}
  function openModal(type,data={}){state.modalType=type;const forms={teacher:teacherForm,plan:planForm,student:studentForm,class:classForm,pricing:pricingForm,session:sessionForm,attendance:attendanceForm,report:reportForm,fee:feeForm,password:passwordForm};const titles={teacher:'Tambah Guru SaaS',plan:data.plan_id?'Edit Paket':'Tambah Paket',student:data.student_id?'Edit Profil Siswa':'Tambah Siswa',class:data.class_id?'Edit Kelas':'Buat Kelas',pricing:data.profile_id?'Edit Aturan Tarif':'Aturan Tarif Baru',session:'Sesi Tambahan',attendance:'Presensi Sesi',report:'Laporan Progres',fee:'Catatan Biaya Manual',password:'Ganti Password'};$('#modalTitle').textContent=titles[type];$('#modalBody').innerHTML=forms[type](data);$('#modalError').classList.add('hidden');setModalBusy(false);$('#modalForm').onsubmit=submitModal;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#modal').close());$('#modal').showModal();if(type==='pricing')$('#addTier').onclick=addTier;if(type==='report'){const s=document.querySelector('[name=session_id]');s.onchange=()=>filterReportStudents(s.value);if(s.value)filterReportStudents(s.value)}}
  function teacherForm(){return `<div class="form-grid">${field('name','Nama guru','text',true)}${field('email','Email','email',true)}${field('workspace_name','Nama workspace','text',true)}<div class="field"><label>Paket</label><select name="plan_id">${state.d.plans.filter(p=>p.status==='ACTIVE').map(p=>`<option value="${h(p.plan_id)}">${h(p.name)} · ${rp(p.monthly_price)}</option>`).join('')}</select></div></div>`}
  function planForm(p={}){return `<input type="hidden" name="plan_id" value="${h(p.plan_id)}"><input type="hidden" name="created_at" value="${h(p.created_at)}"><div class="form-grid">${field('name','Nama paket','text',true,p.name)}${field('monthly_price','Harga bulanan','number',true,p.monthly_price||0)}${field('student_limit','Batas murid','number',true,p.student_limit||10)}<div class="field"><label>Status</label><select name="status"><option value="ACTIVE">Aktif</option><option value="ARCHIVED" ${p.status==='ARCHIVED'?'selected':''}>Arsip</option></select></div></div>`}
  function studentForm(s={}){return `<input type="hidden" name="student_id" value="${h(s.student_id)}"><input type="hidden" name="created_at" value="${h(s.created_at)}"><div class="form-grid">${field('name','Nama lengkap','text',true,s.name)}${field('nickname','Nama panggilan','text',false,s.nickname)}${field('birth_date','Tanggal lahir','date',false,s.birth_date)}${field('student_phone','WhatsApp siswa','tel',false,s.student_phone)}${field('school','Sekolah','text',false,s.school)}${field('grade','Kelas/tingkat','text',false,s.grade)}${field('subject','Mata pelajaran','text',true,s.subject)}${field('start_date','Tanggal mulai','date',false,s.start_date)}${field('parent_name','Nama orang tua','text',true,s.parent_name)}${field('parent_relation','Hubungan','text',false,s.parent_relation)}${field('parent_phone','WhatsApp orang tua','tel',false,s.parent_phone||s.phone)}${field('parent_email','Email orang tua','email',true,s.parent_email)}${area('address','Alamat',s.address)}${area('learning_goal','Tujuan belajar',s.learning_goal)}${area('learning_notes','Catatan kebutuhan belajar',s.learning_notes)}<input type="hidden" name="fee_type" value="PER_SESSION"><input type="hidden" name="fee_amount" value="0"><input type="hidden" name="fee_due_day" value="10"><input type="hidden" name="status" value="ACTIVE"></div>`}
  function classForm(c={}){const mem=state.d.classMembers.filter(m=>m.class_id===c.class_id&&m.status==='ACTIVE'),rules=state.d.scheduleRules.filter(r=>r.class_id===c.class_id&&r.status==='ACTIVE'),days=new Set(rules.map(r=>String(r.day_of_week))),first=rules[0]||{};return `<input type="hidden" name="class_id" value="${h(c.class_id)}"><input type="hidden" name="created_at" value="${h(c.created_at)}"><div class="form-grid">${field('name','Nama kelas','text',true,c.name)}<div class="field"><label>Jenis</label><select name="class_type"><option value="INDIVIDUAL">Individu</option><option value="GROUP" ${c.class_type==='GROUP'?'selected':''}>Kelompok</option></select></div>${field('subject','Mata pelajaran','text',true,c.subject)}${field('location','Lokasi/tautan','text',false,c.location)}${field('duration_minutes','Durasi menit','number',true,c.duration_minutes||90)}<div class="field"><label>Profil tarif kelompok</label><select name="pricing_profile_id"><option value="">Gunakan tarif kelas</option>${state.d.pricingProfiles.filter(p=>p.status==='ACTIVE').map(p=>`<option value="${h(p.profile_id)}" ${p.profile_id===c.pricing_profile_id?'selected':''}>${h(p.name)}</option>`).join('')}</select></div>${field('default_fee_amount','Tarif individu/default','number',true,c.default_fee_amount||0)}<input type="hidden" name="default_fee_type" value="PER_SESSION">${field('start_time','Jam mulai','time',true,first.start_time||'16:00')}${field('effective_from','Mulai berlaku','date',true,first.effective_from||new Date().toISOString().slice(0,10))}${field('effective_until','Sampai','date',true,first.effective_until||new Date(Date.now()+90*86400000).toISOString().slice(0,10))}<div class="field full"><label>Hari belajar</label><div class="actions">${[['1','Sen'],['2','Sel'],['3','Rab'],['4','Kam'],['5','Jum'],['6','Sab'],['0','Min']].map(([v,l])=>`<label class="btn btn-sm"><input type="checkbox" name="days" value="${v}" ${days.has(v)?'checked':''}>${l}</label>`).join('')}</div></div><div class="field full"><label>Peserta</label><div class="list">${state.d.students.map(s=>`<label class="item"><input type="checkbox" name="members" value="${h(s.student_id)}" ${mem.some(m=>m.student_id===s.student_id)?'checked':''}><b>${h(s.name)}</b><span class="item-sub">${h(s.grade)}</span><input type="hidden" name="member_fee_type_${h(s.student_id)}" value="PER_SESSION"><input type="hidden" name="member_fee_amount_${h(s.student_id)}" value="${h(c.default_fee_amount||0)}"></label>`).join('')}</div></div></div>`}
  function pricingForm(p={}){const tiers=state.d.pricingTiers.filter(t=>t.profile_id===p.profile_id&&t.status==='ACTIVE');return `<input type="hidden" name="profile_id" value="${h(p.profile_id)}"><input type="hidden" name="created_at" value="${h(p.created_at)}"><div class="form-grid">${field('name','Nama aturan tarif','text',true,p.name)}<div class="field"><label>Cakupan</label><select name="scope"><option value="GLOBAL">Global</option><option value="CLASS" ${p.scope==='CLASS'?'selected':''}>Kelas tertentu</option></select></div><div class="field full"><label>Kelas (jika khusus)</label><select name="class_id"><option value="">Pilih kelas</option>${state.d.classes.map(c=>`<option value="${h(c.class_id)}" ${c.class_id===p.class_id?'selected':''}>${h(c.name)}</option>`).join('')}</select></div><div class="field full"><label>Tingkatan berdasarkan peserta hadir</label><div id="tierRows">${(tiers.length?tiers:[{min_attendees:1,max_attendees:1,price_per_student:70000},{min_attendees:2,max_attendees:2,price_per_student:50000}]).map((t,i)=>tierRow(t,i)).join('')}</div><button type="button" id="addTier" class="btn btn-sm">+ Tambah tingkat</button></div></div>`}
  function tierRow(t,i){return `<div class="tier-row" data-tier><div class="field"><label>Min hadir</label><input name="tier_min_${i}" type="number" min="1" value="${h(t.min_attendees)}" required></div><div class="field"><label>Maks hadir</label><input name="tier_max_${i}" type="number" min="1" value="${h(t.max_attendees)}" required></div><div class="field tier-price"><label>Harga/orang</label><input name="tier_price_${i}" type="number" min="0" value="${h(t.price_per_student)}" required></div><button type="button" class="icon-btn" onclick="this.closest('[data-tier]').remove()"><span class="mi">delete</span></button></div>`}function addTier(){const rows=document.querySelectorAll('[data-tier]'),i=rows.length;$('#tierRows').insertAdjacentHTML('beforeend',tierRow({min_attendees:i+1,max_attendees:i+1,price_per_student:0},i))}
  function sessionForm(){return `<div class="form-grid"><div class="field full"><label>Kelas</label><select name="class_id" required><option value="">Pilih kelas</option>${state.d.classes.filter(c=>c.status==='ACTIVE').map(c=>`<option value="${h(c.class_id)}">${h(c.name)}</option>`).join('')}</select></div>${field('start_at','Tanggal dan waktu','datetime-local',true)}${field('duration_minutes','Durasi menit','number',true,90)}${field('subject','Mata pelajaran')}${field('location','Lokasi/tautan')}</div>`}
  function attendanceForm(x){const s=state.d.sessions.find(v=>v.session_id===x.session_id),ids=s.class_id?state.d.classMembers.filter(m=>m.class_id===s.class_id&&m.status==='ACTIVE').map(m=>m.student_id):[s.student_id];return `<input type="hidden" name="session_id" value="${h(x.session_id)}"><div class="notice">Tarif kelompok dihitung dari jumlah peserta berstatus Hadir.</div><div class="list">${ids.map(id=>{const old=state.d.attendance.find(a=>a.session_id===x.session_id&&a.student_id===id),v=old?.status||'PRESENT';return `<div class="item"><div class="item-main"><b>${h(student(id).name)}</b></div><select name="attendance_${h(id)}" class="btn"><option value="PRESENT">Hadir</option><option value="ABSENT_BILLABLE" ${v==='ABSENT_BILLABLE'?'selected':''}>Tidak hadir—tetap ditagih</option><option value="ABSENT_FREE" ${v==='ABSENT_FREE'?'selected':''}>Tidak hadir—bebas biaya</option></select></div>`}).join('')}</div>`}
  function reportForm(x){return `<div class="form-grid"><div class="field full"><label>Sesi</label><select name="session_id" required><option value="">Pilih sesi</option>${state.d.sessions.filter(s=>s.status!=='CANCELLED').map(s=>`<option value="${h(s.session_id)}" ${s.session_id===x.session_id?'selected':''}>${h(s.class_id?klass(s.class_id).name:student(s.student_id).name)} · ${dtime(s.start_at)}</option>`).join('')}</select></div><div class="field full"><label>Siswa</label><select name="student_id" required><option value="">Pilih siswa</option></select></div>${field('material','Materi','text',true)}${area('progress','Progres')}${area('homework','PR/latihan')}${field('score','Nilai','number')}${area('teacher_note','Catatan untuk orang tua')}</div>`}
  function feeForm(){return `<div class="form-grid"><div class="field full"><label>Siswa</label><select name="student_id" required>${state.d.students.map(s=>`<option value="${h(s.student_id)}">${h(s.name)}</option>`).join('')}</select></div>${field('period','Periode','month',true,new Date().toISOString().slice(0,7))}${field('amount','Nominal','number',true)}${field('due_date','Jatuh tempo','date',true)}${field('description','Keterangan','text',true,'Biaya les')}<input type="hidden" name="status" value="UNPAID"></div>`}function passwordForm(){return `<div class="form-grid">${field('current_password','Password saat ini','password',true)}${field('new_password','Password baru','password',true)}${field('confirm_password','Ulangi password baru','password',true)}</div>`}
  function collect(form){const fd=new FormData(form),o=Object.fromEntries(fd);o.members=fd.getAll('members');o.days=fd.getAll('days');if(state.modalType==='class'){o.member_fees={};o.members.forEach(id=>o.member_fees[id]={fee_type:fd.get('member_fee_type_'+id)||'PER_SESSION',fee_amount:fd.get('member_fee_amount_'+id)||o.default_fee_amount})}if(state.modalType==='attendance'){o.entries=[];for(const [k,v] of fd.entries())if(k.startsWith('attendance_'))o.entries.push({student_id:k.replace('attendance_',''),status:v})}if(state.modalType==='pricing'){o.tiers=[];document.querySelectorAll('[data-tier]').forEach((r,i)=>o.tiers.push({min_attendees:r.querySelector(`[name^="tier_min_"]`).value,max_attendees:r.querySelector(`[name^="tier_max_"]`).value,price_per_student:r.querySelector(`[name^="tier_price_"]`).value}))}return o}
  function setModalBusy(on){const b=$('#modalSubmit');b.disabled=on;b.textContent=on?'Menyimpan…':'Simpan';document.querySelectorAll('#modalForm input,#modalForm select,#modalForm textarea').forEach(x=>x.disabled=on)}function modalErr(msg){const e=$('#modalError');e.textContent=msg;e.classList.remove('hidden')}
  async function submitModal(e){e.preventDefault();const type=state.modalType,data=collect(e.currentTarget);if(type==='password'&&data.new_password!==data.confirm_password)return modalErr('Konfirmasi password tidak sama.');const act={teacher:'createTeacher',plan:'savePlan',student:'saveStudent',class:'saveClass',pricing:'savePricingProfile',session:'saveSession',attendance:'saveAttendance',report:'saveReport',fee:'saveFee',password:'changePassword'}[type];$('#modalError').classList.add('hidden');setModalBusy(true);try{const r=await api(act,data);if(type==='teacher'){state.d=r.dashboard;state.credential={kind:'teacher',email:r.teacherEmail,password:r.temporaryPassword};state.page='teachers'}else if(type==='password'){state.boot=r;state.d=r.dashboard}else state.d=r;$('#modal').close();render();toast('Data berhasil disimpan.')}catch(x){modalErr(x.message)}finally{setModalBusy(false)}}
  function filterReportStudents(sessionId){const s=state.d.sessions.find(x=>x.session_id===sessionId),el=document.querySelector('[name=student_id]');if(!s||!el)return;const ids=s.class_id?state.d.classMembers.filter(m=>m.class_id===s.class_id&&m.status==='ACTIVE').map(m=>m.student_id):[s.student_id];el.innerHTML='<option value="">Pilih siswa</option>'+state.d.students.filter(x=>ids.includes(x.student_id)).map(x=>`<option value="${h(x.student_id)}">${h(x.name)}</option>`).join('')}
  async function simpleAction(action,data,msg){busy(true);try{state.d=await api(action,data);render();toast(msg)}catch(x){toast(x.message,true)}finally{busy(false)}}async function resetTeacher(id){busy(true);try{const r=await api('resetTeacherPassword',{tenant_id:id});state.d=r.dashboard;state.credential={kind:'teacher',email:r.teacherEmail,password:r.temporaryPassword};render()}catch(x){toast(x.message,true)}finally{busy(false)}}
  async function parentAccess(id){busy(true);try{const r=await api('inviteParent',{student_id:id,sendEmail:true});state.d=r.dashboard;state.credential={kind:'parent',email:r.parentEmail,password:r.temporaryPassword};render();toast(r.warning||'Akses orang tua dibuat.',!!r.warning)}catch(x){toast(x.message,true)}finally{busy(false)}}
  async function saveSettings(e){e.preventDefault();busy(true);try{state.d=await api('saveTeacherSettings',Object.fromEntries(new FormData(e.currentTarget)));render();toast('Pengaturan disimpan.')}catch(x){toast(x.message,true)}finally{busy(false)}}
  async function formLink(){busy(true);try{const r=await api('getEnrollmentFormLink');state.d=r.dashboard;copyText(r.url);render();toast('Tautan formulir disalin.')}catch(x){toast(x.message,true)}finally{busy(false)}}
  async function approveApp(id){busy(true);try{state.d=await api('approveStudentApplication',{application_id:id,fee_type:'PER_SESSION',fee_amount:0,fee_due_day:10});render();toast('Pendaftaran disetujui dan siswa dibuat.')}catch(x){toast(x.message,true)}finally{busy(false)}}
  function whatsappFee(id){const f=state.d.fees.find(x=>x.fee_id===id),s=student(f.student_id),set=state.d.settings||{},tpl=set.whatsapp_template||'Halo {{nama_orang_tua}}, tagihan les {{nama_siswa}} periode {{periode}} sebesar {{total}}. Jatuh tempo {{jatuh_tempo}}. {{instruksi_pembayaran}}';const msg=tpl.replaceAll('{{nama_orang_tua}}',s.parent_name||'Bapak/Ibu').replaceAll('{{nama_siswa}}',s.name).replaceAll('{{periode}}',f.period).replaceAll('{{total}}',rp(f.amount)).replaceAll('{{jatuh_tempo}}',dt(f.due_date)).replaceAll('{{instruksi_pembayaran}}',set.payment_instructions||'Hubungi guru');copyText(msg);const phone=String(s.parent_phone||s.phone||'').replace(/\D/g,'').replace(/^0/,'62');window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank');toast('Pesan disalin dan WhatsApp dibuka.')}
  async function generateDoc(id,type){busy(true);try{const r=await api('generateFeeDocument',{fee_id:id,type});state.d=r.dashboard;saveFile(r.file);render();toast(type==='INVOICE'?'Invoice dibuat.':'Kuitansi dibuat.')}catch(x){toast(x.message,true)}finally{busy(false)}}async function downloadDoc(id,type){busy(true);try{saveFile(await api('downloadFeeDocument',{fee_id:id,type}))}catch(x){toast(x.message,true)}finally{busy(false)}}function saveFile(f){const bytes=Uint8Array.from(atob(f.base64),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:f.mimeType})),a=document.createElement('a');a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));return}fallbackCopy(text)}function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
  if(localStorage.getItem('leskita_theme')==='dark')document.documentElement.classList.add('dark');start();
</script>
