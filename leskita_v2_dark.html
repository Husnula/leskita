*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f1117;--ink2:#4a5060;--ink3:#9299a8;
  --surf:#f5f6f8;--card:#ffffff;
  --side:#0f1117;--side2:#1c2030;--side3:#262d3d;
  --stext:#c8cdd8;--stext2:#6b7280;
  --green:#22c55e;--green2:#15803d;--greenbg:#f0fdf4;--greentxt:#166534;
  --purple:#8b5cf6;--purplebg:#f5f3ff;--purpletxt:#5b21b6;
  --amber:#f59e0b;--amberbg:#fffbeb;--ambertxt:#92400e;
  --red:#ef4444;--redbg:#fef2f2;--redtxt:#991b1b;
  --blue:#3b82f6;
  --border:#e5e7eb;--borderdk:#2a3347;
}
.wrap{display:flex;height:750px;font-family:system-ui,-apple-system,sans-serif;font-size:14px;background:var(--surf)}

/* SIDEBAR */
.side{width:210px;flex-shrink:0;background:var(--side);display:flex;flex-direction:column}
.side-logo{padding:20px 16px 16px;border-bottom:1px solid var(--borderdk);display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;background:#22c55e;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
.logo-name{font-size:15px;font-weight:600;color:#fff}
.logo-sub{font-size:10px;color:var(--stext2);margin-top:1px}
.nav-section{padding:16px 8px 8px}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--stext2);padding:0 8px;margin-bottom:6px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;color:var(--stext);font-size:13px;cursor:pointer;margin-bottom:1px;transition:background .1s}
.nav-item:hover{background:var(--side2)}
.nav-item.act{background:var(--side3);color:#fff}
.nav-item i{font-size:16px;opacity:.75}
.nav-item.act i{opacity:1}
.side-bottom{margin-top:auto;padding:12px 8px;border-top:1px solid var(--borderdk)}
.user-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer}
.user-row:hover{background:var(--side2)}
.u-av{width:28px;height:28px;border-radius:50%;background:#22c55e;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.u-name{font-size:12px;color:#fff;font-weight:500}
.u-role{font-size:10px;color:var(--stext2)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
.search{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--ink3);flex:1;max-width:340px}
.search i{font-size:15px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.tb-icon{font-size:18px;color:var(--ink3);cursor:pointer}
.content{flex:1;overflow-y:auto;padding:28px}

/* PAGES */
.ph{font-size:20px;font-weight:600;color:var(--ink);margin-bottom:4px}
.ps{font-size:13px;color:var(--ink3);margin-bottom:24px}

/* STAT CARDS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.sc-label{font-size:11px;color:var(--ink3);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.sc-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.sc-num{font-size:26px;font-weight:700;color:var(--ink);line-height:1}
.sc-trend{font-size:11px;margin-top:4px}

/* PANELS */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.panel-hd{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.panel-hd a{font-size:11px;color:var(--blue);font-weight:400;cursor:pointer}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.trow:last-child{border:none}
.tav{width:32px;height:32px;border-radius:50%;background:var(--greenbg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--green2);flex-shrink:0}
.tav.unk{background:var(--surf);color:var(--ink3)}
.tname{font-size:13px;font-weight:500;color:var(--ink)}
.tmeta{font-size:11px;color:var(--ink3)}
.pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:auto}
.pill.free{background:var(--surf);color:var(--ink3)}
.pill.active{background:var(--greenbg);color:var(--greentxt)}
.pill.pro{background:var(--purplebg);color:var(--purpletxt)}

/* BAR CHART SIMPLE */
.bar-row{margin-bottom:12px}
.bar-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-bottom:5px}
.bar-meta span:last-child{font-weight:600;color:var(--ink)}
.bar-track{height:6px;background:var(--surf);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}

/* TEACHERS */
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.tc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.tc-top{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
.tc-av{width:40px;height:40px;border-radius:50%;background:var(--greenbg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--green2);flex-shrink:0}
.tc-av.u{background:var(--surf);color:var(--ink3)}
.tc-nm{font-size:14px;font-weight:600;color:var(--ink)}
.tc-ws{font-size:11px;color:var(--ink3);margin-top:2px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px}
.tc-fields{display:flex;flex-direction:column;gap:5px}
.tc-field{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3)}
.tc-field i{font-size:13px;flex-shrink:0}
.tc-acts{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.act-btn{flex:1;padding:5px 0;text-align:center;font-size:11px;font-weight:500;border-radius:6px;background:var(--surf);border:1px solid var(--border);color:var(--ink2);cursor:pointer}
.act-btn.del{background:var(--redbg);border-color:#fca5a5;color:var(--redtxt)}

/* FILTERS */
.fbar{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.fsearch{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--ink3)}
.fchip{padding:5px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:var(--card);color:var(--ink2);cursor:pointer}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* PLANS */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;position:relative;overflow:visible}
.pcard.pop{border:2px solid var(--green);border-radius:14px}
.pop-badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:3px 14px;border-radius:20px;white-space:nowrap;letter-spacing:.3px}
.plan-tier{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--ink3);margin-bottom:8px}
.plan-price{font-size:32px;font-weight:800;color:var(--ink);line-height:1;margin-bottom:2px}
.plan-price sub{font-size:14px;font-weight:400;color:var(--ink3)}
.plan-desc{font-size:12px;color:var(--ink3);margin-bottom:16px}
.plan-divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.feat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);padding:4px 0}
.feat i{font-size:14px}
.feat .y{color:var(--green2)}
.feat .n{color:var(--ink3)}
.pcta{display:block;width:100%;margin-top:18px;padding:10px;text-align:center;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.pcta.outline{border:1.5px solid var(--border);background:transparent;color:var(--ink)}
.pcta.outline:hover{border-color:var(--ink)}
.pcta.solid{background:var(--green);border:none;color:#fff}
.pcta.solid:hover{background:var(--green2)}
.pcta.dark{background:var(--ink);border:none;color:#fff}
.pcta.dark:hover{background:#1c2030}
</style>
