<script>
  const TOKEN='leskita_auth_token';
  const root=document.getElementById('root');
  const state={boot:null,d:null,page:'dashboard',weekOffset:0,modalType:null,credential:null,selectedStudent:null};
  const roleMenus={
    ADMIN:[['dashboard','dashboard','Dashboard'],['teachers','school','Guru SaaS'],['plans','sell','Paket']],
    TEACHER:[['dashboard','dashboard','Beranda'],['calendar','calendar_month','Kalender'],['classes','groups','Kelas'],['students','person','Siswa'],['applications','how_to_reg','Pendaftaran'],['reports','assignment','Laporan'],['fees','payments','Tagihan'],['pricing','price_change','Tarif'],['settings','settings','Pengaturan']],
    PARENT:[['dashboard','home','Beranda'],['calendar','event','Jadwal'],['reports','monitoring','Progres'],['fees','receipt_long','Biaya & Dokumen'],['account','manage_accounts','Akun']]
  };
  const $=s=>document.querySelector(s);const h=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const rp=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v||0));
  const dt=(v,opt={day:'numeric',month:'short',year:'numeric'})=>v?new Intl.DateTimeFormat('id-ID',opt).format(new Date(v)):'-';
  const dtime=v=>dt(v,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});const role=()=>state.boot?.user?.role;
  const initials=n=>String(n||'U').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
  function api(action,data={},tenantId){return new Promise((res,rej)=>{if(!(window.google&&google.script&&google.script.run))return rej(new Error('Buka aplikasi melalui deployment Google Apps Script.'));google.script.run.withSuccessHandler(r=>r?.ok?res(r.data):rej(new Error(r?.error||'Terjadi kesalahan.'))).withFailureHandler(e=>rej(new Error(e.message||String(e)))).api(action,{data,tenantId:tenantId||state.boot?.user?.tenant_id,authToken:localStorage.getItem(TOKEN)||''})})}
  function busy(on){$('#loading')?.classList.toggle('hidden',!on)}function toast(msg,err=false){const el=$('#toast');el.textContent=msg;el.className='toast'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3800)}
  function badge(s){const m={ACTIVE:'success',PAID:'success',APPROVED:'success',DONE:'success',TRIAL:'info',NEW:'info',SCHEDULED:'info',UNPAID:'warning',PARTIAL:'warning',SUSPENDED:'danger',CANCELLED:'danger',REJECTED:'danger',ARCHIVED:'danger'};return `<span class="badge ${m[s]||'info'}">${h(s)}</span>`}
  function student(id){return state.d?.students?.find(x=>x.student_id===id)||{name:'Siswa'}}function klass(id){return state.d?.classes?.find(x=>x.class_id===id)||{name:'Kelas'}}
  async function start(){const publicToken=new URLSearchParams(location.search).get('daftar');if(publicToken){busy(true);try{const form=await api('getPublicEnrollmentForm',{token:publicToken});renderPublicForm(form)}catch(e){renderLogin(e.message)}finally{busy(false)}return}if(!localStorage.getItem(TOKEN)){busy(false);renderLogin();return}busy(true);try{state.boot=await api('bootstrap',{},'');state.d=state.boot.dashboard;render()}catch(e){localStorage.removeItem(TOKEN);renderLogin(e.message)}finally{busy(false)}}
  function renderLogin(message=''){root.innerHTML=`<main class="login"><section class="login-card"><div class="logo-mark login-logo"><span class="mi">school</span></div><h1>Masuk ke LesKita</h1><p>Gunakan email terdaftar dan password Anda.</p>${message?`<div class="notice" style="margin-top:16px">${h(message)}</div>`:''}<form id="loginForm" class="form-grid" style="margin-top:22px"><div class="field full"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field full"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><div class="field full"><button class="btn btn-primary btn-block">Masuk</button></div></form></section></main>`;$('#loginForm').onsubmit=login}
  async function login(e){e.preventDefault();busy(true);try{const r=await api('login',Object.fromEntries(new FormData(e.currentTarget)));localStorage.setItem(TOKEN,r.token);state.boot=r.bootstrap;state.d=state.boot.dashboard;render();if(state.boot.user.must_change_password)toast('Silakan ganti password sementara.')}catch(x){renderLogin(x.message)}finally{busy(false)}}
  async function logout(){try{await api('logout')}catch(e){}localStorage.removeItem(TOKEN);state.boot=null;state.d=null;renderLogin()}
  function renderPublicForm(form){root.innerHTML=`<main class="login"><section class="login-card" style="max-width:680px"><div class="logo-mark login-logo"><span class="mi">school</span></div><h1>${h(form.workspaceName)}</h1><p>Formulir pendaftaran calon siswa · ${h(form.teacherName)}</p><form id="publicForm" class="form-grid" style="margin-top:22px"><input type="hidden" name="token" value="${h(form.token)}">${field('student_name','Nama lengkap siswa','text',true)}${field('nickname','Nama panggilan')}${field('birth_date','Tanggal lahir','date')}${field('student_phone','No. WhatsApp siswa')}${field('school','Sekolah')}${field('grade','Kelas/tingkat','text',true)}${field('subject','Mata pelajaran','text',true)}${field('parent_name','Nama orang tua/wali','text',true)}${field('parent_relation','Hubungan dengan siswa')}${field('parent_phone','No. WhatsApp orang tua','tel',true)}${field('parent_email','Email orang tua','email',true)}${area('address','Alamat')}${area('learning_goal','Tujuan belajar')}${area('preferred_schedule','Pilihan hari dan jam')}${area('notes','Catatan tambahan')}<div class="field full"><label><input type="checkbox" required> Saya menyetujui data ini digunakan untuk administrasi les.</label></div><div class="field full"><button class="btn btn-primary btn-block">Kirim pendaftaran</button></div></form></section></main>`;$('#publicForm').onsubmit=submitPublicForm}
  async function submitPublicForm(e){e.preventDefault();busy(true);try{await api('submitStudentApplication',Object.fromEntries(new FormData(e.currentTarget)));e.currentTarget.innerHTML='<div class="credential"><b>Pendaftaran berhasil dikirim.</b><p>Guru akan menghubungi Anda melalui WhatsApp atau email.</p></div>'}catch(x){toast(x.message,true)}finally{busy(false)}}
  function field(name,label,type='text',required=false,value=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${h(value)}" ${required?'required':''}></div>`}function area(name,label,value=''){return `<div class="field full"><label>${label}</label><textarea name="${name}">${h(value)}</textarea></div>`}
  function render(){const menus=roleMenus[role()]||[];if(!menus.some(x=>x[0]===state.page)&&state.page!=='more')state.page='dashboard';root.innerHTML=`<div class="shell"><aside class="sidebar"><div class="logo"><div class="logo-mark"><span class="mi">school</span></div><div><h1>LesKita</h1><small>Tutoring Management</small></div></div>${role()==='TEACHER'?`<button class="btn btn-primary quick" data-open="session"><span class="mi">add</span>Sesi tambahan</button>`:''}<nav class="nav">${nav(menus)}</nav><div class="sidebar-user"><div class="avatar">${h(initials(state.boot.user.name))}</div><div class="user-copy"><b>${h(state.boot.user.name)}</b><small>${h(role())}</small></div><button class="icon-btn" data-logout style="color:#fff"><span class="mi">logout</span></button></div></aside><section class="main"><header class="topbar"><div class="search"><span class="mi">search</span><input placeholder="Cari siswa, kelas, atau tagihan…"></div><div class="top-actions"><button class="icon-btn" data-theme><span class="mi">dark_mode</span></button><button class="icon-btn"><span class="mi">notifications</span></button><div class="avatar">${h(initials(state.boot.user.name))}</div></div></header><main class="content">${state.boot.user.must_change_password?`<div class="notice">Anda masih menggunakan password sementara. <button class="btn btn-sm" data-open="password">Ganti sekarang</button></div>`:''}${page()}</main></section><nav class="bottom-nav">${mobileNav(menus)}</nav></div>`;bind()}
  function nav(menus){return menus.map(([id,icon,label])=>`<button class="${state.page===id?'active':''}" data-page="${id}"><span class="mi">${icon}</span><span>${label}</span></button>`).join('')}
  function mobileNav(menus){if(menus.length<=5)return nav(menus);return nav(menus.slice(0,4))+`<button class="${state.page==='more'?'active':''}" data-page="more"><span class="mi">more_horiz</span><span>Lainnya</span></button>`}
  function header(title,sub,actions=''){return `<div class="page-head"><div><h2>${h(title)}</h2><p>${h(sub)}</p></div><div class="actions">${actions}</div></div>`}function stat(label,val,icon,note=''){return `<div class="stat"><div class="stat-top"><span>${h(label)}</span><span class="stat-icon"><span class="mi">${icon}</span></span></div><div class="stat-value">${h(val)}</div>${note?`<div class="stat-note">${h(note)}</div>`:''}</div>`}
  function page(){if(role()==='ADMIN')return adminPage();if(role()==='TEACHER')return teacherPage();return parentPage()}
  function adminPage(){const d=state.d;if(state.page==='teachers')return `${header('Guru SaaS','Kelola pelanggan, trial, dan akses.',`<button class="btn btn-primary" data-open="teacher"><span class="mi">add</span>Tambah guru</button>`)}${state.credential?credential('Password sementara guru'):''}<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Guru</th><th>Workspace</th><th>Status</th><th>Murid</th><th>Aksi</th></tr></thead><tbody>${d.tenants.map(t=>`<tr><td><b>${h(t.teacher_name)}</b><br><small>${h(t.teacher_email)}</small></td><td>${h(t.workspace_name)}</td><td>${badge(t.status)}</td><td>${h(t.student_count)}</td><td><div class="row-actions"><button class="btn btn-sm" data-reset-teacher="${h(t.tenant_id)}">Reset password</button>${t.status!=='ACTIVE'?`<button class="btn btn-sm" data-tenant-status="ACTIVE" data-id="${h(t.tenant_id)}">Aktifkan</button>`:''}${t.status!=='SUSPENDED'?`<button class="btn btn-sm btn-danger" data-tenant-status="SUSPENDED" data-id="${h(t.tenant_id)}">Suspend</button>`:''}</div></td></tr>`).join('')}</tbody></table></div></div>`;if(state.page==='plans')return `${header('Paket SaaS','Kelola harga dan kuota paket.',`<button class="btn btn-primary" data-open="plan"><span class="mi">add</span>Tambah paket</button>`)}<div class="grid3">${d.plans.map(p=>`<div class="card card-pad"><div class="card-title">${h(p.name)} ${badge(p.status)}</div><div class="stat-value">${rp(p.monthly_price)}</div><p class="item-sub">Maksimal ${h(p.student_limit)} murid aktif.</p><div class="row-actions"><button class="btn btn-sm" data-edit-plan="${h(p.plan_id)}">Edit</button>${p.status!=='ARCHIVED'?`<button class="btn btn-sm btn-danger" data-archive-plan="${h(p.plan_id)}">Arsip</button>`:''}</div></div>`).join('')}</div>`;return `${header('Dashboard SaaS','Pantau kesehatan dan pertumbuhan platform.')}<div class="stats">${stat('Total guru',d.stats.totalTeachers,'school')}${stat('Aktif',d.stats.active,'verified')}${stat('Trial',d.stats.trial,'timer')}${stat('Suspended',d.stats.suspended,'block')}</div><div class="grid2"><div class="card"><div class="card-head"><span class="card-title">Guru terbaru</span><button class="btn btn-sm" data-page="teachers">Lihat semua</button></div><div class="card-pad list">${d.tenants.slice(-5).reverse().map(t=>`<div class="item"><div class="avatar">${h(initials(t.teacher_name))}</div><div class="item-main"><div class="item-title">${h(t.teacher_name)}</div><div class="item-sub">${h(t.workspace_name)} · ${h(t.student_count)} murid</div></div>${badge(t.status)}</div>`).join('')}</div></div><div class="card card-pad"><div class="card-title">Model bisnis</div><div class="notice" style="margin-top:12px">Platform memproses langganan guru. Pembayaran les tetap langsung antara orang tua dan guru.</div></div></div>`}
  function teacherPage(){if(state.page==='more')return `${header('Menu lainnya','Pilih modul yang ingin dibuka.')}<div class="grid3">${roleMenus.TEACHER.slice(4).map(([id,icon,label])=>`<button class="card card-pad" data-page="${id}" style="text-align:left;color:var(--text)"><span class="stat-icon"><span class="mi">${icon}</span></span><h3>${h(label)}</h3></button>`).join('')}</div>`;if(state.page==='calendar')return calendarPage(false);if(state.page==='classes')return classesPage();if(state.page==='students')return studentsPage();if(state.page==='applications')return applicationsPage();if(state.page==='reports')return reportsPage();if(state.page==='fees')return feesPage(true);if(state.page==='pricing')return pricingPage();if(state.page==='settings')return settingsPage();return teacherDashboard()}
  function teacherDashboard(){const d=state.d;const today=d.sessions.filter(s=>new Date(s.start_at).toDateString()===new Date().toDateString()&&s.status!=='CANCELLED');return `${header('Selamat datang, '+state.boot.user.name,'Kelola pekerjaan penting hari ini.')}<div class="stats">${stat('Siswa aktif',d.stats.activeStudents,'group')}${stat('Jadwal mendatang',d.stats.upcomingSessions,'event')}${stat('Laporan tertunda',d.stats.unpublishedReports,'assignment_late')}${stat('Belum lunas',rp(d.stats.unpaidTotal),'payments')}</div><div class="grid2"><div class="card"><div class="card-head"><span class="card-title">Sesi hari ini</span><button class="btn btn-sm" data-page="calendar">Buka kalender</button></div><div class="card-pad">${sessionList(today,true)}</div></div><div class="card"><div class="card-head"><span class="card-title">Perlu tindakan</span></div><div class="card-pad list"><div class="item"><span class="stat-icon"><span class="mi">how_to_reg</span></span><div class="item-main"><div class="item-title">${state.d.applications.filter(a=>a.status==='NEW').length} pendaftaran baru</div></div><button class="btn btn-sm" data-page="applications">Tinjau</button></div><div class="item"><span class="stat-icon"><span class="mi">assignment_late</span></span><div class="item-main"><div class="item-title">${d.stats.unpublishedReports} laporan tertunda</div></div><button class="btn btn-sm" data-page="reports">Buka</button></div></div></div></div>`}
  function classesPage(){const d=state.d,active=d.classes.filter(c=>c.status==='ACTIVE');return `${header('Kelas','Kelas individu atau kelompok dan jadwal rutinnya.',`<button class="btn btn-primary" data-open="class"><span class="mi">add</span>Buat kelas</button>`)}<div class="grid3">${active.length?active.map(c=>{const mem=d.classMembers.filter(m=>m.class_id===c.class_id&&m.status==='ACTIVE'),rules=d.scheduleRules.filter(r=>r.class_id===c.class_id&&r.status==='ACTIVE'),profile=d.pricingProfiles.find(p=>p.profile_id===c.pricing_profile_id);return `<div class="card card-pad"><div class="card-title">${h(c.name)} ${badge(c.class_type==='GROUP'?'GROUP':'INDIVIDUAL')}</div><p class="item-sub">${h(c.subject)} · ${h(c.duration_minutes)} menit · ${mem.length} peserta</p><p class="item-sub">${rules.map(r=>dayName(r.day_of_week)+' '+r.start_time).join(', ')}</p><p class="item-sub">Tarif: ${profile?h(profile.name):rp(c.default_fee_amount)}</p><div class="row-actions"><button class="btn btn-sm" data-edit-class="${h(c.class_id)}">Edit</button><button class="btn btn-sm btn-danger" data-archive-class="${h(c.class_id)}">Arsip</button></div></div>`}).join(''):`<div class="empty">Belum ada kelas.</div>`}</div>`}
  function studentsPage(){const d=state.d;return `${header('Database Siswa','Profil, orang tua, kebutuhan belajar, dan riwayat.',`<button class="btn btn-primary" data-open="student"><span class="mi">person_add</span>Tambah siswa</button>`)}${state.credential?.kind==='parent'?credential('Password sementara orang tua'):''}<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Siswa</th><th>Sekolah</th><th>Orang tua</th><th>WhatsApp</th><th>Aksi</th></tr></thead><tbody>${d.students.map(s=>`<tr><td><b>${h(s.name)}</b><br><small>${h(s.grade)} · ${h(s.subject)}</small></td><td>${h(s.school||'-')}</td><td>${h(s.parent_name)}<br><small>${h(s.parent_email)}</small></td><td>${h(s.parent_phone||s.phone||'-')}</td><td><div class="row-actions"><button class="btn btn-sm" data-view-student="${h(s.student_id)}">Profil</button><button class="btn btn-sm" data-edit-student="${h(s.student_id)}">Edit</button><button class="btn btn-sm" data-parent-access="${h(s.student_id)}">Akses orang tua</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
  function applicationsPage(){const apps=state.d.applications;return `${header('Pendaftaran Online','Terima calon siswa melalui formulir publik.',`<button class="btn btn-primary" data-form-link><span class="mi">link</span>Buat/salin tautan</button>`)}<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Calon siswa</th><th>Orang tua</th><th>Pelajaran</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${apps.length?apps.map(a=>`<tr><td><b>${h(a.student_name)}</b><br><small>${dt(a.submitted_at)}</small></td><td>${h(a.parent_name)}<br><small>${h(a.parent_phone)}</small></td><td>${h(a.subject)} · ${h(a.grade)}</td><td>${badge(a.status)}</td><td><div class="row-actions">${a.status==='NEW'?`<button class="btn btn-sm btn-primary" data-approve-app="${h(a.application_id)}">Setujui</button><button class="btn btn-sm btn-danger" data-reject-app="${h(a.application_id)}">Tolak</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">Belum ada pendaftaran.</div></td></tr>`}</tbody></table></div></div>`}
  function calendarPage(parent){const sessions=state.d.sessions.filter(s=>s.status!=='CANCELLED');return `${header(parent?'Jadwal belajar':'Kalender Mingguan',parent?'Jadwal yang dibuat oleh guru.':'Lihat waktu terisi dan slot yang masih kosong.',parent?'':`<button class="btn btn-primary" data-open="session"><span class="mi">add</span>Sesi tambahan</button>`)}${weekCalendar(sessions,parent)}`}
  function weekCalendar(sessions,parent){const start=weekStart(state.weekOffset),days=[0,1,2,3,4,5,6].map(i=>new Date(start.getTime()+i*86400000));const inWeek=sessions.filter(s=>{const d=new Date(s.start_at);return d>=days[0]&&d<new Date(days[6].getTime()+86400000)});return `<div class="card"><div class="calendar-toolbar"><div class="actions"><button class="btn btn-sm" data-week="-1"><span class="mi">chevron_left</span></button><button class="btn btn-sm" data-week="0">Hari ini</button><button class="btn btn-sm" data-week="1"><span class="mi">chevron_right</span></button></div><b>${dt(days[0])} – ${dt(days[6])}</b></div><div class="calendar-scroll"><div class="week-calendar"><div class="cal-head"></div>${days.map(d=>`<div class="cal-head ${d.toDateString()===new Date().toDateString()?'today':''}">${dayName(d.getDay())}<br><b>${d.getDate()}</b></div>`).join('')}<div class="time-col">${Array.from({length:14},(_,i)=>`<div class="time-label">${String(i+7).padStart(2,'0')}:00</div>`).join('')}</div>${days.map(day=>`<div class="day-col">${inWeek.filter(s=>new Date(s.start_at).toDateString()===day.toDateString()).map(s=>eventHtml(s,parent)).join('')}</div>`).join('')}</div><div class="cal-agenda">${sessionList(inWeek,parent)}</div></div></div>`}
  function eventHtml(s,parent){const d=new Date(s.start_at),top=((d.getHours()+d.getMinutes()/60)-7)*56,height=Math.max(30,Number(s.duration_minutes||60)/60*56),c=klass(s.class_id);return `<div class="event ${c.class_type==='GROUP'?'group':''} ${s.status==='DONE'?'done':''}" style="top:${top}px;height:${height}px" data-session="${h(s.session_id)}"><b>${h(c.name||student(s.student_id).name)}</b>${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} · ${h(s.subject)}</div>`}
  function reportsPage(){return `${header(role()==='PARENT'?'Progres Belajar':'Laporan Progres',role()==='PARENT'?'Laporan yang diterbitkan guru.':'Catatan individual untuk setiap siswa.')}<div class="list">${state.d.reports.length?state.d.reports.map(reportHtml).join(''):`<div class="empty">Belum ada laporan.</div>`}</div>`}function reportHtml(r){return `<article class="report"><h3>${h(student(r.student_id).name)} · ${h(r.material)}</h3><div class="report-meta">${dtime(r.published_at)}${r.score!==''?' · Nilai '+h(r.score):''}</div><div class="report-grid"><div class="report-field"><b>PROGRES</b>${h(r.progress)}</div><div class="report-field"><b>PR/LATIHAN</b>${h(r.homework||'Tidak ada')}</div>${r.teacher_note?`<div class="report-field" style="grid-column:1/-1"><b>CATATAN GURU</b>${h(r.teacher_note)}</div>`:''}</div></article>`}
  function pricingPage(){const p=state.d.pricingProfiles.filter(x=>x.status==='ACTIVE');return `${header('Aturan Tarif','Tarif kelompok ditentukan oleh jumlah peserta yang hadir.',`<button class="btn btn-primary" data-open="pricing"><span class="mi">add</span>Aturan tarif</button>`)}<div class="notice">Contoh: 1 peserta Rp70.000/orang, 2 peserta Rp50.000/orang. Tarif dipotret saat presensi disimpan.</div><div class="grid3">${p.length?p.map(x=>{const tiers=state.d.pricingTiers.filter(t=>t.profile_id===x.profile_id&&t.status==='ACTIVE');return `<div class="card card-pad"><div class="card-title">${h(x.name)}</div><p class="item-sub">${h(x.scope)}</p><div class="list">${tiers.map(t=>`<div class="item"><div class="item-main">${h(t.min_attendees)}–${h(t.max_attendees)} hadir</div><b>${rp(t.price_per_student)}/orang</b></div>`).join('')}</div><div class="row-actions"><button class="btn btn-sm" data-edit-pricing="${h(x.profile_id)}">Edit</button><button class="btn btn-sm btn-danger" data-archive-pricing="${h(x.profile_id)}">Arsip</button></div></div>`}).join(''):`<div class="empty">Belum ada aturan tarif.</div>`}</div>`}
  function feesPage(teacher){const fees=state.d.fees;return `${header(teacher?'Tagihan & Pencatatan':'Biaya & Dokumen',teacher?'Hitung otomatis dari presensi dan kirim pengingat.':'Pembayaran tetap dilakukan langsung kepada guru.',teacher?`<button class="btn" data-sync-fees><span class="mi">sync</span>Hitung ulang</button><button class="btn btn-primary" data-open="fee"><span class="mi">add</span>Catatan manual</button>`:'')}<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Siswa/periode</th><th>Rincian</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${fees.length?fees.map(f=>`<tr><td><b>${h(student(f.student_id).name)}</b><br><small>${h(f.period)}</small></td><td>${h(f.description)}<br><small>${f.source_type==='AUTOMATIC'?'Dihitung dari presensi':'Catatan manual'}</small></td><td class="money">${rp(f.amount)}</td><td>${badge(f.status)}</td><td><div class="row-actions">${teacher?`${f.status!=='PAID'?`<button class="btn btn-sm" data-paid="${h(f.fee_id)}">Tandai lunas</button>`:''}<button class="btn btn-sm" data-wa="${h(f.fee_id)}">WhatsApp</button><button class="btn btn-sm" data-doc="INVOICE" data-fee="${h(f.fee_id)}">Invoice</button>${f.status==='PAID'?`<button class="btn btn-sm" data-doc="RECEIPT" data-fee="${h(f.fee_id)}">Kuitansi</button>`:''}`:`${f.invoice_file_id?`<button class="btn btn-sm" data-download="INVOICE" data-fee="${h(f.fee_id)}">Invoice</button>`:''}${f.receipt_file_id?`<button class="btn btn-sm" data-download="RECEIPT" data-fee="${h(f.fee_id)}">Kuitansi</button>`:''}`}</div></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">Belum ada catatan biaya.</div></td></tr>`}</tbody></table></div></div>`}
  function settingsPage(){const s=state.d.settings||{};return `${header('Pengaturan Workspace','Profil guru, pembayaran, template pesan, dan keamanan.',`<button class="btn" data-open="password">Ganti password</button>`)}<div class="card card-pad"><form id="settingsForm" class="form-grid">${field('teacher_name','Nama guru','text',true,s.teacher_name)}${field('workspace_name','Nama workspace','text',true,s.workspace_name)}${field('phone','Nomor WhatsApp','tel',false,s.phone)}${field('default_due_day','Tanggal jatuh tempo','number',false,s.default_due_day||10)}${area('payment_instructions','Instruksi pembayaran',s.payment_instructions)}${area('whatsapp_template','Template WhatsApp',s.whatsapp_template||'Halo {{nama_orang_tua}}, tagihan les {{nama_siswa}} periode {{periode}} sebesar {{total}}. Jatuh tempo {{jatuh_tempo}}. {{instruksi_pembayaran}}')}<input type="hidden" name="default_fee_type" value="PER_SESSION"><input type="hidden" name="default_fee_amount" value="0"><div class="field full"><button class="btn btn-primary">Simpan pengaturan</button></div></form></div>`}
  function parentPage(){if(state.page==='calendar')return calendarPage(true);if(state.page==='reports')return reportsPage();if(state.page==='fees')return feesPage(false);if(state.page==='account')return `${header('Akun','Kelola keamanan akun.',`<button class="btn btn-primary" data-open="password">Ganti password</button>`)}<div class="card card-pad"><div class="item"><div class="avatar">${h(initials(state.boot.user.name))}</div><div class="item-main"><div class="item-title">${h(state.boot.user.name)}</div><div class="item-sub">${h(state.boot.user.email)}</div></div><button class="btn" data-logout>Keluar</button></div></div>`;const next=state.d.sessions.find(s=>new Date(s.start_at)>=new Date()&&s.status!=='CANCELLED');return `${header('Halo, '+state.boot.user.name,'Pantau jadwal, perkembangan, dan administrasi belajar.')} ${next?`<div class="profile-hero"><small>Jadwal berikutnya</small><h3>${h(klass(next.class_id).name||student(next.student_id).name)} · ${h(next.subject)}</h3><p>${dtime(next.start_at)} · ${h(next.location||'Lokasi menyusul')}</p></div>`:''}<div class="stats">${stat('Anak terhubung',state.d.students.length,'person')}${stat('Jadwal mendatang',state.d.stats.upcomingSessions,'event')}${stat('Laporan tersedia',state.d.stats.publishedReports,'assignment')}${stat('Belum lunas',rp(state.d.stats.unpaidTotal),'payments')}</div><div class="grid2"><div class="card"><div class="card-head"><span class="card-title">Progres terbaru</span></div><div class="card-pad">${state.d.reports[0]?reportHtml(state.d.reports[0]):`<div class="empty">Belum ada laporan.</div>`}</div></div><div class="card"><div class="card-head"><span class="card-title">Biaya terbaru</span></div><div class="card-pad">${state.d.fees[0]?`<div class="item"><div class="item-main"><div class="item-title">${h(state.d.fees[0].description)}</div><div class="item-sub">${h(state.d.fees[0].period)}</div></div><b>${rp(state.d.fees[0].amount)}</b></div>`:`<div class="empty">Belum ada biaya.</div>`}</div></div></div>`}
  function sessionList(items,parent){return items.length?`<div class="list">${items.map(s=>`<div class="item"><div class="datebox">${new Date(s.start_at).getDate()}<br>${dt(s.start_at,{month:'short'})}</div><div class="item-main"><div class="item-title">${h(s.class_id?klass(s.class_id).name:student(s.student_id).name)} · ${h(s.subject)}</div><div class="item-sub">${dtime(s.start_at)} · ${h(s.duration_minutes)} menit</div></div>${badge(s.status)}${!parent&&s.status!=='CANCELLED'?`<button class="btn btn-sm" data-attendance="${h(s.session_id)}">Presensi</button><button class="btn btn-sm" data-report="${h(s.session_id)}">Laporan</button>`:''}</div>`).join('')}</div>`:`<div class="empty">Tidak ada jadwal.</div>`}
  function credential(title){return `<div class="credential"><b>${h(title)}</b><div>${h(state.credential.email)}</div><code>${h(state.credential.password)}</code><small>Salin sekarang; password hanya ditampilkan pada sesi ini.</small></div>`}function dayName(d){return ['Min','Sen','Sel','Rab','Kam','Jum','Sab'][Number(d)]||'-'}function weekStart(offset=0){const n=new Date(),day=(n.getDay()+6)%7;n.setHours(0,0,0,0);n.setDate(n.getDate()-day+offset*7);return n}
</script>
