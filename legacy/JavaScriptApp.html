<script>
  function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open));document.querySelectorAll('[data-logout]').forEach(b=>b.onclick=logout);document.querySelector('[data-theme]')?.addEventListener('click',()=>{document.documentElement.classList.toggle('dark');localStorage.setItem('leskita_theme',document.documentElement.classList.contains('dark')?'dark':'light')});document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{const v=Number(b.dataset.week);state.weekOffset=v===0?0:state.weekOffset+v;render()});bindActions();$('#settingsForm')?.addEventListener('submit',saveSettings)}
  function bindActions(){document.querySelectorAll('[data-edit-plan]').forEach(b=>b.onclick=()=>openModal('plan',state.d.plans.find(x=>x.plan_id===b.dataset.editPlan)));document.querySelectorAll('[data-archive-plan]').forEach(b=>b.onclick=()=>simpleAction('archivePlan',{plan_id:b.dataset.archivePlan},'Paket diarsipkan.'));document.querySelectorAll('[data-reset-teacher]').forEach(b=>b.onclick=()=>resetTeacher(b.dataset.resetTeacher));document.querySelectorAll('[data-tenant-status]').forEach(b=>b.onclick=()=>simpleAction('updateTenantStatus',{tenant_id:b.dataset.id,status:b.dataset.tenantStatus},'Status diperbarui.'));document.querySelectorAll('[data-edit-student]').forEach(b=>b.onclick=()=>openModal('student',state.d.students.find(x=>x.student_id===b.dataset.editStudent)));document.querySelectorAll('[data-view-student]').forEach(b=>b.onclick=()=>studentProfile(b.dataset.viewStudent));document.querySelectorAll('[data-parent-access]').forEach(b=>b.onclick=()=>parentAccess(b.dataset.parentAccess));document.querySelectorAll('[data-edit-class]').forEach(b=>b.onclick=()=>openModal('class',state.d.classes.find(x=>x.class_id===b.dataset.editClass)));document.querySelectorAll('[data-archive-class]').forEach(b=>b.onclick=()=>simpleAction('archiveClass',{class_id:b.dataset.archiveClass},'Kelas diarsipkan.'));document.querySelectorAll('[data-edit-pricing]').forEach(b=>b.onclick=()=>openModal('pricing',state.d.pricingProfiles.find(x=>x.profile_id===b.dataset.editPricing)));document.querySelectorAll('[data-archive-pricing]').forEach(b=>b.onclick=()=>simpleAction('archivePricingProfile',{profile_id:b.dataset.archivePricing},'Aturan tarif diarsipkan.'));document.querySelectorAll('[data-attendance]').forEach(b=>b.onclick=()=>openModal('attendance',{session_id:b.dataset.attendance}));document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>openModal('report',{session_id:b.dataset.report}));if(role()==='TEACHER')document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>openModal('attendance',{session_id:b.dataset.session}));document.querySelector('[data-sync-fees]')?.addEventListener('click',()=>simpleAction('syncAutomaticFees',{period:new Date().toISOString().slice(0,7)},'Biaya dihitung ulang.'));document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>simpleAction('updateFeeStatus',{fee_id:b.dataset.paid,status:'PAID',payment_note:'Ditandai lunas oleh guru'},'Ditandai lunas.'));document.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>whatsappFee(b.dataset.wa));document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>generateDoc(b.dataset.fee,b.dataset.doc));document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadDoc(b.dataset.fee,b.dataset.download));document.querySelector('[data-form-link]')?.addEventListener('click',formLink);document.querySelectorAll('[data-approve-app]').forEach(b=>b.onclick=()=>approveApp(b.dataset.approveApp));document.querySelectorAll('[data-reject-app]').forEach(b=>b.onclick=()=>simpleAction('rejectStudentApplication',{application_id:b.dataset.rejectApp},'Pendaftaran ditolak.'))}
  function studentProfile(id){state.selectedStudent=id;const s=student(id),reports=state.d.reports.filter(r=>r.student_id===id),fees=state.d.fees.filter(f=>f.student_id===id);$('.content').innerHTML=`${header('Profil '+s.name,'Database lengkap siswa.',`<button class="btn" data-back-students>Kembali</button><button class="btn btn-primary" data-edit-student="${h(id)}">Edit profil</button>`)}<div class="profile-hero"><h3>${h(s.name)}</h3><p>${h(s.school||'-')} · ${h(s.grade||'-')} · ${h(s.subject||'-')}</p></div><div class="grid2"><div class="card card-pad"><div class="card-title">Identitas & Kontak</div><div class="list" style="margin-top:12px"><div class="item"><div class="item-main"><div class="item-sub">Alamat</div><b>${h(s.address||'-')}</b></div></div><div class="item"><div class="item-main"><div class="item-sub">Orang tua</div><b>${h(s.parent_name)} · ${h(s.parent_phone||'-')}</b></div></div><div class="item"><div class="item-main"><div class="item-sub">Tujuan belajar</div><b>${h(s.learning_goal||'-')}</b></div></div></div></div><div class="card card-pad"><div class="card-title">Ringkasan</div><div class="stats" style="grid-template-columns:1fr 1fr;margin-top:12px">${stat('Laporan',reports.length,'assignment')}${stat('Catatan biaya',fees.length,'payments')}</div></div></div>`;document.querySelector('[data-back-students]').onclick=()=>{state.page='students';render()};document.querySelector('[data-edit-student]').onclick=()=>openModal('student',s)}
  function openModal(type,data={}){state.modalType=type;const forms={teacher:teacherForm,plan:planForm,student:studentForm,class:classForm,pricing:pricingForm,session:sessionForm,attendance:attendanceForm,report:reportForm,fee:feeForm,password:passwordForm};const titles={teacher:'Tambah Guru SaaS',plan:data.plan_id?'Edit Paket':'Tambah Paket',student:data.student_id?'Edit Profil Siswa':'Tambah Siswa',class:data.class_id?'Edit Kelas':'Buat Kelas',pricing:data.profile_id?'Edit Aturan Tarif':'Aturan Tarif Baru',session:'Sesi Tambahan',attendance:'Presensi Sesi',report:'Laporan Progres',fee:'Catatan Biaya Manual',password:'Ganti Password'};$('#modalTitle').textContent=titles[type];$('#modalBody').innerHTML=forms[type](data);$('#modalError').classList.add('hidden');setModalBusy(false);$('#modalForm').onsubmit=submitModal;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#modal').close());$('#modal').showModal();if(type==='pricing')$('#addTier').onclick=addTier;if(type==='report'){const s=document.querySelector('[name=session_id]');s.onchange=()=>filterReportStudents(s.value);if(s.value)filterReportStudents(s.value)}}
  function teacherForm(){return `<div class="form-grid">${field('name','Nama guru','text',true)}${field('email','Email','email',true)}${field('workspace_name','Nama workspace','text',true)}<div class="field"><label>Paket</label><select name="plan_id">${state.d.plans.filter(p=>p.status==='ACTIVE').map(p=>`<option value="${h(p.plan_id)}">${h(p.name)} · ${rp(p.monthly_price)}</option>`).join('')}</select></div></div>`}
  function planForm(p={}){return `<input type="hidden" name="plan_id" value="${h(p.plan_id)}"><input type="hidden" name="created_at" value="${h(p.created_at)}"><div class="form-grid">${field('name','Nama paket','text',true,p.name)}${field('monthly_price','Harga bulanan','number',true,p.monthly_price||0)}${field('student_limit','Batas murid','number',true,p.student_limit||10)}<div class="field"><label>Status</label><select name="status"><option value="ACTIVE">Aktif</option><option value="ARCHIVED" ${p.status==='ARCHIVED'?'selected':''}>Arsip</option></select></div></div>`}
  function studentForm(s={}){return `<input type="hidden" name="student_id" value="${h(s.student_id)}"><input type="hidden" name="created_at" value="${h(s.created_at)}"><div class="form-grid">${field('name','Nama lengkap','text',true,s.name)}${field('nickname','Nama panggilan','text',false,s.nickname)}${field('birth_date','Tanggal lahir','date',false,s.birth_date)}${field('student_phone','WhatsApp siswa','tel',false,s.student_phone)}${field('school','Sekolah','text',false,s.school)}${field('grade','Kelas/tingkat','text',false,s.grade)}${field('subject','Mata pelajaran','text',true,s.subject)}${field('start_date','Tanggal mulai','date',false,s.start_date)}${field('parent_name','Nama orang tua','text',true,s.parent_name)}${field('parent_relation','Hubungan','text',false,s.parent_relation)}${field('parent_phone','WhatsApp orang tua','tel',false,s.parent_phone||s.phone)}${field('parent_email','Email orang tua','email',true,s.parent_email)}${area('address','Alamat',s.address)}${area('learning_goal','Tujuan belajar',s.learning_goal)}${area('learning_notes','Catatan kebutuhan belajar',s.learning_notes)}<input type="hidden" name="fee_type" value="PER_SESSION"><input type="hidden" name="fee_amount" value="0"><input type="hidden" name="fee_due_day" value="10"><input type="hidden" name="status" value="ACTIVE"></div>`}
  function classForm(c={}){const mem=state.d.classMembers.filter(m=>m.class_id===c.class_id&&m.status==='ACTIVE'),rules=state.d.scheduleRules.filter(r=>r.class_id===c.class_id&&r.status==='ACTIVE'),days=new Set(rules.map(r=>String(r.day_of_week))),first=rules[0]||{};return `<input type="hidden" name="class_id" value="${h(c.class_id)}"><input type="hidden" name="created_at" value="${h(c.created_at)}"><div class="form-grid">${field('name','Nama kelas','text',true,c.name)}<div class="field"><label>Jenis</label><select name="class_type"><option value="INDIVIDUAL">Individu</option><option value="GROUP" ${c.class_type==='GROUP'?'selected':''}>Kelompok</option></select></div>${field('subject','Mata pelajaran','text',true,c.subject)}${field('location','Lokasi/tautan','text',false,c.location)}${field('duration_minutes','Durasi menit','number',true,c.duration_minutes||90)}<div class="field"><label>Profil tarif kelompok</label><select name="pricing_profile_id"><option value="">Gunakan tarif kelas</option>${state.d.pricingProfiles.filter(p=>p.status==='ACTIVE').map(p=>`<option value="${h(p.profile_id)}" ${p.profile_id===c.pricing_profile_id?'selected':''}>${h(p.name)}</option>`).join('')}</select></div>${field('default_fee_amount','Tarif individu/default','number',true,c.default_fee_amount||0)}<input type="hidden" name="default_fee_type" value="PER_SESSION">${field('start_time','Jam mulai','time',true,first.start_time||'16:00')}${field('effective_from','Mulai berlaku','date',true,first.effective_from||new Date().toISOString().slice(0,10))}${field('effective_until','Sampai','date',true,first.effective_until||new Date(Date.now()+90*86400000).toISOString().slice(0,10))}<div class="field full"><label>Hari belajar</label><div class="actions">${[['1','Sen'],['2','Sel'],['3','Rab'],['4','Kam'],['5','Jum'],['6','Sab'],['0','Min']].map(([v,l])=>`<label class="btn btn-sm"><input type="checkbox" name="days" value="${v}" ${days.has(v)?'checked':''}>${l}</label>`).join('')}</div></div><div class="field full"><label>Peserta</label><div class="list">${state.d.students.map(s=>`<label class="item"><input type="checkbox" name="members" value="${h(s.student_id)}" ${mem.some(m=>m.student_id===s.student_id)?'checked':''}><b>${h(s.name)}</b><span class="item-sub">${h(s.grade)}</span><input type="hidden" name="member_fee_type_${h(s.student_id)}" value="PER_SESSION"><input type="hidden" name="member_fee_amount_${h(s.student_id)}" value="${h(c.default_fee_amount||0)}"></label>`).join('')}</div></div></div>`}
  function pricingForm(p={}){const tiers=state.d.pricingTiers.filter(t=>t.profile_id===p.profile_id&&t.status==='ACTIVE');return `<input type="hidden" name="profile_id" value="${h(p.profile_id)}"><input type="hidden" name="created_at" value="${h(p.created_at)}"><div class="form-grid">${field('name','Nama aturan tarif','text',true,p.name)}<div class="field"><label>Cakupan</label><select name="scope"><option value="GLOBAL">Global</option><option value="CLASS" ${p.scope==='CLASS'?'selected':''}>Kelas tertentu</option></select></div><div class="field full"><label>Kelas (jika khusus)</label><select name="class_id"><option value="">Pilih kelas</option>${state.d.classes.map(c=>`<option value="${h(c.class_id)}" ${c.class_id===p.class_id?'selected':''}>${h(c.name)}</option>`).join('')}</select></div><div class="field full"><label>Tingkatan berdasarkan peserta hadir</label><div id="tierRows">${(tiers.length?tiers:[{min_attendees:1,max_attendees:1,price_per_student:70000},{min_attendees:2,max_attendees:2,price_per_student:50000}]).map((t,i)=>tierRow(t,i)).join('')}</div><button type="button" id="addTier" class="btn btn-sm">+ Tambah tingkat</button></div></div>`}
  function tierRow(t,i){return `<div class="tier-row" data-tier><div class="field"><label>Min hadir</label><input name="tier_min_${i}" type="number" min="1" value="${h(t.min_attendees)}" required></div><div class="field"><label>Maks hadir</label><input name="tier_max_${i}" type="number" min="1" value="${h(t.max_attendees)}" required></div><div class="field tier-price"><label>Harga/orang</label><input name="tier_price_${i}" type="number" min="0" value="${h(t.price_per_student)}" required></div><button type="button" class="icon-btn" onclick="this.closest('[data-tier]').remove()"><span class="mi">delete</span></button></div>`}function addTier(){const rows=document.querySelectorAll('[data-tier]'),i=rows.length;$('#tierRows').insertAdjacentHTML('beforeend',tierRow({min_attendees:i+1,max_attendees:i+1,price_per_student:0},i))}
  function sessionForm(){return `<div class="form-grid"><div class="field full"><label>Kelas</label><select name="class_id" required><option value="">Pilih kelas</option>${state.d.classes.filter(c=>c.status==='ACTIVE').map(c=>`<option value="${h(c.class_id)}">${h(c.name)}</option>`).join('')}</select></div>${field('start_at','Tanggal dan waktu','datetime-local',true)}${field('duration_minutes','Durasi menit','number',true,90)}${field('subject','Mata pelajaran')}${field('location','Lokasi/tautan')}</div>`}
  function attendanceForm(x){const s=state.d.sessions.find(v=>v.session_id===x.session_id),ids=s.class_id?state.d.classMembers.filter(m=>m.class_id===s.class_id&&m.status==='ACTIVE').map(m=>m.student_id):[s.student_id];return `<input type="hidden" name="session_id" value="${h(x.session_id)}"><div class="notice">Tarif kelompok dihitung dari jumlah peserta berstatus Hadir.</div><div class="list">${ids.map(id=>{const old=state.d.attendance.find(a=>a.session_id===x.session_id&&a.student_id===id),v=old?.status||'PRESENT';return `<div class="item"><div class="item-main"><b>${h(student(id).name)}</b></div><select name="attendance_${h(id)}" class="btn"><option value="PRESENT">Hadir</option><option value="ABSENT_BILLABLE" ${v==='ABSENT_BILLABLE'?'selected':''}>Tidak hadir—tetap ditagih</option><option value="ABSENT_FREE" ${v==='ABSENT_FREE'?'selected':''}>Tidak hadir—bebas biaya</option></select></div>`}).join('')}</div>`}
  function reportForm(x){return `<div class="form-grid"><div class="field full"><label>Sesi</label><select name="session_id" required><option value="">Pilih sesi</option>${state.d.sessions.filter(s=>s.status!=='CANCELLED').map(s=>`<option value="${h(s.session_id)}" ${s.session_id===x.session_id?'selected':''}>${h(s.class_id?klass(s.class_id).name:student(s.student_id).name)} · ${dtime(s.start_at)}</option>`).join('')}</select></div><div class="field full"><label>Siswa</label><select name="student_id" required><option value="">Pilih siswa</option></select></div>${field('material','Materi','text',true)}${area('progress','Progres')}${area('homework','PR/latihan')}${field('score','Nilai','number')}${area('teacher_note','Catatan untuk orang tua')}</div>`}
  function feeForm(){return `<div class="form-grid"><div class="field full"><label>Siswa</label><select name="student_id" required>${state.d.students.map(s=>`<option value="${h(s.student_id)}">${h(s.name)}</option>`).join('')}</select></div>${field('period','Periode','month',true,new Date().toISOString().slice(0,7))}${field('amount','Nominal','number',true)}${field('due_date','Jatuh tempo','date',true)}${field('description','Keterangan','text',true,'Biaya les')}<input type="hidden" name="status" value="UNPAID"></div>`}function passwordForm(){return `<div class="form-grid">${field('current_password','Password saat ini','password',true)}${field('new_password','Password baru','password',true)}${field('confirm_password','Ulangi password baru','password',true)}</div>`}
  function collect(form){const fd=new FormData(form),o=Object.fromEntries(fd);o.members=fd.getAll('members');o.days=fd.getAll('days');if(state.modalType==='class'){o.member_fees={};o.members.forEach(id=>o.member_fees[id]={fee_type:fd.get('member_fee_type_'+id)||'PER_SESSION',fee_amount:fd.get('member_fee_amount_'+id)||o.default_fee_amount})}if(state.modalType==='attendance'){o.entries=[];for(const [k,v] of fd.entries())if(k.startsWith('attendance_'))o.entries.push({student_id:k.replace('attendance_',''),status:v})}if(state.modalType==='pricing'){o.tiers=[];document.querySelectorAll('[data-tier]').forEach((r,i)=>o.tiers.push({min_attendees:r.querySelector(`[name^="tier_min_"]`).value,max_attendees:r.querySelector(`[name^="tier_max_"]`).value,price_per_student:r.querySelector(`[name^="tier_price_"]`).value}))}return o}
  function setModalBusy(on){const b=$('#modalSubmit');b.disabled=on;b.textContent=on?'Menyimpan…':'Simpan';document.querySelectorAll('#modalForm input,#modalForm select,#modalForm textarea').forEach(x=>x.disabled=on)}function modalErr(msg){const e=$('#modalError');e.textContent=msg;e.classList.remove('hidden')}
  async function submitModal(e){e.preventDefault();const type=state.modalType,data=collect(e.currentTarget);if(type==='password'&&data.new_password!==data.confirm_password)return modalErr('Konfirmasi password tidak sama.');const act={teacher:'createTeacher',plan:'savePlan',student:'saveStudent',class:'saveClass',pricing:'savePricingProfile',session:'saveSession',attendance:'saveAttendance',report:'saveReport',fee:'saveFee',password:'changePassword'}[type];$('#modalError').classList.add('hidden');setModalBusy(true);try{const r=await api(act,data);if(type==='teacher'){state.d=r.dashboard;state.credential={kind:'teacher',email:r.teacherEmail,password:r.temporaryPassword};state.page='teachers'}else if(type==='password'){state.boot=r;state.d=r.dashboard}else state.d=r;$('#modal').close();render();toast('Data berhasil disimpan.')}catch(x){modalErr(x.message)}finally{setModalBusy(false)}}
  function filterReportStudents(sessionId){const s=state.d.sessions.find(x=>x.session_id===sessionId),el=document.querySelector('[name=student_id]');if(!s||!el)return;const ids=s.class_id?state.d.classMembers.filter(m=>m.class_id===s.class_id&&m.status==='ACTIVE').map(m=>m.student_id):[s.student_id];el.innerHTML='<option value="">Pilih siswa</option>'+state.d.students.filter(x=>ids.includes(x.student_id)).map(x=>`<option value="${h(x.student_id)}">${h(x.name)}</option>`).join('')}
  async function simpleAction(action,data,msg){busy(true);try{state.d=await api(action,data);render();toast(msg)}catch(x){toast(x.message,true)}finally{busy(false)}}async function resetTeacher(id){busy(true);try{const r=await api('resetTeacherPassword',{tenant_id:id});state.d=r.dashboard;state.credential={kind:'teacher',email:r.teacherEmail,password:r.temporaryPassword};render()}catch(x){toast(x.message,true)}finally{busy(false)}}
  async function parentAccess(id){busy(true);try{const r=await api('inviteParent',{student_id:id,sendEmail:true});state.d=r.dashboard;state.credential={kind:'parent',email:r.parentEmail,password:r.temporaryPassword};render();toast(r.warning||'Akses orang tua dibuat.',!!r.warning)}catch(x){toast(x.message,true)}finally{busy(false)}}
  async function saveSettings(e){e.preventDefault();busy(true);try{state.d=await api('saveTeacherSettings',Object.fromEntries(new FormData(e.currentTarget)));render();toast('Pengaturan disimpan.')}catch(x){toast(x.message,true)}finally{busy(false)}}
  async function formLink(){busy(true);try{const r=await api('getEnrollmentFormLink');state.d=r.dashboard;copyText(r.url);render();toast('Tautan formulir disalin.')}catch(x){toast(x.message,true)}finally{busy(false)}}
  async function approveApp(id){busy(true);try{state.d=await api('approveStudentApplication',{application_id:id,fee_type:'PER_SESSION',fee_amount:0,fee_due_day:10});render();toast('Pendaftaran disetujui dan siswa dibuat.')}catch(x){toast(x.message,true)}finally{busy(false)}}
  function whatsappFee(id){const f=state.d.fees.find(x=>x.fee_id===id),s=student(f.student_id),set=state.d.settings||{},tpl=set.whatsapp_template||'Halo {{nama_orang_tua}}, tagihan les {{nama_siswa}} periode {{periode}} sebesar {{total}}. Jatuh tempo {{jatuh_tempo}}. {{instruksi_pembayaran}}';const msg=tpl.replaceAll('{{nama_orang_tua}}',s.parent_name||'Bapak/Ibu').replaceAll('{{nama_siswa}}',s.name).replaceAll('{{periode}}',f.period).replaceAll('{{total}}',rp(f.amount)).replaceAll('{{jatuh_tempo}}',dt(f.due_date)).replaceAll('{{instruksi_pembayaran}}',set.payment_instructions||'Hubungi guru');copyText(msg);const phone=String(s.parent_phone||s.phone||'').replace(/\D/g,'').replace(/^0/,'62');window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank');toast('Pesan disalin dan WhatsApp dibuka.')}
  async function generateDoc(id,type){busy(true);try{const r=await api('generateFeeDocument',{fee_id:id,type});state.d=r.dashboard;saveFile(r.file);render();toast(type==='INVOICE'?'Invoice dibuat.':'Kuitansi dibuat.')}catch(x){toast(x.message,true)}finally{busy(false)}}async function downloadDoc(id,type){busy(true);try{saveFile(await api('downloadFeeDocument',{fee_id:id,type}))}catch(x){toast(x.message,true)}finally{busy(false)}}function saveFile(f){const bytes=Uint8Array.from(atob(f.base64),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:f.mimeType})),a=document.createElement('a');a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));return}fallbackCopy(text)}function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
  if(localStorage.getItem('leskita_theme')==='dark')document.documentElement.classList.add('dark');start();
</script>
